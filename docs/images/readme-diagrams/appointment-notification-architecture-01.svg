<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="980" viewBox="0 0 2000 980" role="img" aria-label="HA Notification Architecture">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#27415f" flood-opacity="0.12"/></filter>
  <marker id="arrow-blue" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4f77c9" stroke="#4f77c9"/></marker>
<marker id="arrow-cyan" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4aa6b5" stroke="#4aa6b5"/></marker>
<marker id="arrow-teal" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#2f9f93" stroke="#2f9f93"/></marker>
<marker id="arrow-green" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#3c987e" stroke="#3c987e"/></marker>
<marker id="arrow-amber" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d28a28" stroke="#d28a28"/></marker>
<marker id="arrow-orange" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d9823b" stroke="#d9823b"/></marker>
<marker id="arrow-pink" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d85f8d" stroke="#d85f8d"/></marker>
<marker id="arrow-purple" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#8a65d8" stroke="#8a65d8"/></marker>
<marker id="arrow-red" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#ca5f66" stroke="#ca5f66"/></marker>
<marker id="arrow-slate" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#718096" stroke="#718096"/></marker>
  <style>
    svg{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#f6f9fc}.frame{fill:#ffffff;stroke:#c4d5e8;stroke-width:3;filter:url(#shadow)}
    .title,.panel-title,.card-title,.state-title{font-family:"Architects Daughter","Comic Sans MS",cursive;fill:#263a57}
    .title{font-size:46px}.subtitle{font-size:17px;fill:#526276}.panel-title{font-size:27px}.card-title{font-size:24px}.state-title{font-size:22px}
    .detail,.small,.pill-text,.route-label,.footer{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif;fill:#526276}
    .detail{font-size:14px}.small{font-size:12px}.pill-text{font-size:13px}.route-label{font-size:13px}.footer{font-size:14px}
    .panel{stroke-width:2}.card{stroke-width:2.4;filter:url(#shadow)}.pill{stroke-width:1.8}.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#b7c8dc;stroke-width:2;stroke-dasharray:8 8}.message{fill:none;stroke-width:3;stroke-linecap:round}.note{fill:#fffdf7;stroke:#d7b970;stroke-width:2}
    .table{stroke-width:2.2;filter:url(#shadow)}.table-head{font-family:"Architects Daughter";font-size:21px;fill:#263a57}.row{font-size:12.5px;fill:#526276}
  </style>
</defs>
<rect class="canvas" width="2000" height="980"/>
<rect class="frame" x="48" y="42" width="1904" height="896" rx="34"/>
<text class="title" x="1000" y="104" text-anchor="middle">HA Notification Architecture</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">Separate event delivery from leader-elected reminder delivery and failure isolation.</text>
<rect class="panel" x="105" y="205" width="410" height="580" rx="24" fill="#eef6ff" stroke="#b7d2f4"/><text class="panel-title" x="133" y="247">Event-driven path</text>
<rect class="panel" x="555" y="205" width="500" height="580" rx="24" fill="#f7f0ff" stroke="#c9b7f4"/><text class="panel-title" x="583" y="247">Resilience boundary</text>
<rect class="panel" x="1065" y="205" width="825" height="580" rx="24" fill="#eef9f5" stroke="#a7d5c5"/><text class="panel-title" x="1093" y="247">Reminder scheduler path</text>
<g id="listener"><rect class="card" x="145" y="300" width="320" height="135" rx="16" fill="#fff" stroke="#4f77c9"/><g transform="translate(163 318)"><rect width="44" height="44" rx="10" fill="#4f77c9"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 16h20M12 22h20M12 28h20"/><path d="M27 11l6 5-6 5M27 23l6 5-6 5"/></g></g><text class="card-title" x="221" y="340">NotificationEventListener</text><text class="detail" x="169" y="374" text-anchor="start"><tspan x="169" dy="0">Created, confirmed, cancelled,</tspan><tspan x="169" dy="19">rescheduled events</tspan></text></g>
<g id="channel"><rect class="card" x="600" y="300" width="400" height="145" rx="16" fill="#fff" stroke="#8a65d8"/><g transform="translate(618 318)"><rect width="44" height="44" rx="10" fill="#8a65d8"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="676" y="340">ResilientNotificationChannel</text><text class="detail" x="624" y="374" text-anchor="start"><tspan x="624" dy="0">CircuitBreaker, Retry, and Bulkhead wrap</tspan><tspan x="624" dy="19">the delegate</tspan></text></g>
<g id="dummy"><rect class="card" x="600" y="550" width="400" height="125" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(618 568)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="676" y="590">DummyNotificationChannel</text><text class="detail" x="624" y="624" text-anchor="start"><tspan x="624" dy="0">Logs output and stores DB history</tspan></text></g>
<g id="scheduler"><rect class="card" x="1130" y="285" width="320" height="145" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(1148 303)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="1206" y="325">Hourly scheduler</text><text class="detail" x="1154" y="359" text-anchor="start"><tspan x="1154" dy="0">Checks tomorrow and same-day</tspan><tspan x="1154" dy="19">CONFIRMED appointments</tspan></text></g>
<g id="leader"><rect class="card" x="1580" y="285" width="270" height="145" rx="16" fill="#fff" stroke="#ca5f66"/><svg x="1598" y="303" width="44" height="44" viewBox="0 0 32 32" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><g transform="matrix(.848327 0 0 .848327 -7.883573 -9.449691)"><use xlink:href="#B" fill="#a41e11"/><path d="M45.536 34.95c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276-2.04-1.613-.077-2.382l15.332-5.936c2.332-.836 3.14-.867 5.126-.14S43.55 31.87 45.51 32.6s2.037 1.31.024 2.36z" fill="#d82c20"/><use xlink:href="#B" y="-6.218" fill="#a41e11"/><use xlink:href="#C" fill="#d82c20"/><path d="M45.536 26.098c-2.013 1.05-12.44 5.337-14.66 6.495s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276c-1-.478-1.524-.88-1.524-1.26V21.55s14.447-3.145 16.78-3.982 3.14-.867 5.126-.14 13.853 2.868 15.814 3.587v3.76c0 .377-.452.8-1.477 1.324z" fill="#a41e11"/><use xlink:href="#C" y="-6.449" fill="#d82c20"/><g fill="#fff"><path d="M29.096 20.712l-1.182-1.965-3.774-.34 2.816-1.016-.845-1.56 2.636 1.03 2.486-.814-.672 1.612 2.534.95-3.268.34zM22.8 24.624l8.74-1.342-2.64 3.872z"/><ellipse cx="20.444" rx="4.672" ry="1.811" cy="21.402"/></g><path d="M42.132 21.138l-5.17 2.042-.004-4.087z" fill="#7a0c00"/><path d="M36.963 23.18l-.56.22-5.166-2.042 5.723-2.264z" fill="#ad2115"/></g><defs ><path id="B" d="M45.536 38.764c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276c-1-.478-1.524-.88-1.524-1.26v-3.813s14.447-3.145 16.78-3.982 3.14-.867 5.126-.14 13.853 2.868 15.814 3.587v3.76c0 .377-.452.8-1.477 1.324z"/><path id="C" d="M45.536 28.733c-2.013 1.05-12.44 5.337-14.66 6.494s-3.453 1.146-5.207.308-12.85-5.32-14.85-6.276-2.04-1.613-.077-2.382l15.332-5.935c2.332-.837 3.14-.867 5.126-.14s12.35 4.853 14.312 5.57 2.037 1.31.024 2.36z"/></defs></svg><text class="card-title" x="1656" y="325">Redis leader gate</text><text class="detail" x="1604" y="359" text-anchor="start"><tspan x="1604" dy="0">runIfLeader prevents</tspan><tspan x="1604" dy="19">duplicate scheduler nodes</tspan></text></g>
<g id="history"><rect class="card" x="1260" y="550" width="360" height="125" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(1278 568)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="1336" y="590">NotificationHistory</text><text class="detail" x="1284" y="624" text-anchor="start"><tspan x="1284" dy="0">Duplicate reminder guard and delivery</tspan><tspan x="1284" dy="19">audit</tspan></text></g>
<path class="route" d="M465 368 L600 368" stroke="#4f77c9" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
<path class="route" d="M785 445 L785 550" stroke="#8a65d8" stroke-width="3.2" marker-end="url(#arrow-purple)"/>
<path class="route" d="M1000 612 L1260 612" stroke="#3c987e" stroke-width="3.2" marker-end="url(#arrow-green)"/>
<path class="route" d="M1450 358 L1580 358" stroke="#ca5f66" stroke-width="3.2" marker-end="url(#arrow-red)"/>
<path class="route" d="M1290 430 L1290 550" stroke="#3c987e" stroke-width="3.2" marker-end="url(#arrow-green)"/>
<path class="route" d="M1715 430 L1715.0 491.0 Q1715 505 1701.0 505.0 L1454.0 505.0 Q1440 505 1440.0 519.0 L1440 550" stroke="#ca5f66" stroke-width="2.7" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
<rect class="note" x="230" y="835" width="1540" height="58" rx="16"/><text class="footer" x="1000" y="871" text-anchor="middle">Event notifications are immediate subscriber work; reminders are scheduled work and must pass the Redis leader gate plus history duplicate checks.</text>
</svg>