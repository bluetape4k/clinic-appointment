<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="appointment-notification — HA Notification Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arr" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/>
  </marker>
  <marker id="arr-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#5B8DEF"/>
  </marker>
  <marker id="arr-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#58A978"/>
  </marker>
  <marker id="arr-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D6A441"/>
  </marker>
  <marker id="arr-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC6B82"/>
  </marker>
  <marker id="arr-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#8A72D6"/>
  </marker>
  <marker id="arr-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#45A7A1"/>
  </marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.5"/>
  </marker>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D0D8E4;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:40px;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS",cursive;font-size:13px;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS",cursive;font-size:12px;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS",cursive;font-size:11px;fill:#536273}
    .layerTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#536273;font-style:italic}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arr)}
    .line-blue{stroke:#5B8DEF;stroke-width:2;fill:none;marker-end:url(#arr-blue)}
    .line-green{stroke:#58A978;stroke-width:2;fill:none;marker-end:url(#arr-green)}
    .line-amber{stroke:#D6A441;stroke-width:2;fill:none;marker-end:url(#arr-amber)}
    .line-pink{stroke:#DC6B82;stroke-width:2;fill:none;marker-end:url(#arr-pink)}
    .line-purple{stroke:#8A72D6;stroke-width:2;fill:none;marker-end:url(#arr-purple)}
    .line-teal{stroke:#45A7A1;stroke-width:2;fill:none;marker-end:url(#arr-teal)}
    .dashed{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr)}
    .dashed-blue{stroke:#5B8DEF;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-blue)}
    .dashed-green{stroke:#58A978;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-green)}
    .dashed-amber{stroke:#D6A441;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-amber)}
    .dashed-pink{stroke:#DC6B82;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-pink)}
    .dashed-purple{stroke:#8A72D6;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-purple)}
    .dashed-teal{stroke:#45A7A1;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arr-teal)}
    .inheritLine{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1040" height="620"/>
<rect class="frame" x="28" y="24" width="984" height="572" rx="22"/>
<text class="title" x="62" y="78">HA Notification Flow</text>
<text class="subtitle" x="66" y="100">appointment-notification · Redis Leader Election · Resilience4j guards</text>
<rect x="48" y="118" width="944" height="72" rx="14" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="138" dominant-baseline="middle">Event Sources</text>
<rect x="48" y="204" width="944" height="72" rx="14" fill="#FDECEF" stroke="#DC6B82" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="224" dominant-baseline="middle">Notification Module</text>
<rect x="48" y="290" width="944" height="72" rx="14" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="310" dominant-baseline="middle">Leader Election (HA)</text>
<rect x="48" y="376" width="944" height="72" rx="14" fill="#FFF3D9" stroke="#D6A441" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="396" dominant-baseline="middle">Resilience4j Guards</text>
<rect x="48" y="462" width="944" height="72" rx="14" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="482" dominant-baseline="middle">Notification Channels</text>
<rect x="48" y="548" width="944" height="52" rx="14" fill="#F2F5F9" stroke="#9AA8B8" stroke-width="1" opacity="0.5"/>
<text class="layerTitle" x="62" y="568" dominant-baseline="middle">Persistence</text>
<rect x="68" y="134" width="280" height="50" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="208" y="143" text-anchor="middle" dominant-baseline="middle">AppointmentController</text><text class="mono" x="208" y="161" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">publishes domain events</text><text class="mono" x="208" y="177" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">via Spring ApplicationEvent</text>
<rect x="370" y="134" width="260" height="50" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="500" y="143" text-anchor="middle" dominant-baseline="middle">AppointmentReminderScheduler</text><text class="mono" x="500" y="161" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">@Scheduled(fixedRate=1h)</text><text class="mono" x="500" y="177" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">tomorrow + same-day CONFIRMED</text>
<rect x="652" y="134" width="200" height="50" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="752" y="143" text-anchor="middle" dominant-baseline="middle">RescheduleController</text><text class="mono" x="752" y="161" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">reschedule completion events</text><text class="mono" x="752" y="177" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">closure-triggered</text>
<rect x="68" y="220" width="280" height="50" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="208" y="229" text-anchor="middle" dominant-baseline="middle">NotificationEventListener</text><text class="mono" x="208" y="247" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">@EventListener</text><text class="mono" x="208" y="263" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">Created/StatusChanged/Cancelled/Rescheduled</text>
<rect x="390" y="220" width="240" height="50" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="510" y="229" text-anchor="middle" dominant-baseline="middle">NotificationAutoConfiguration</text><text class="mono" x="510" y="247" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">Spring @Configuration</text><text class="mono" x="510" y="263" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">registers notification beans</text>
<rect x="660" y="220" width="200" height="50" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="760" y="229" text-anchor="middle" dominant-baseline="middle">DuplicateGuard</text><text class="mono" x="760" y="247" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">Redis SETNX</text><text class="mono" x="760" y="263" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">prevents duplicate sends</text>
<rect x="68" y="306" width="360" height="50" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="248" y="315" text-anchor="middle" dominant-baseline="middle">bluetape4k-leader (Redis SETNX)</text><text class="mono" x="248" y="333" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">if (!leaderElection.isLeader()) return</text><text class="mono" x="248" y="349" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">single node runs scheduler</text>
<rect x="450" y="306" width="260" height="50" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="580" y="315" text-anchor="middle" dominant-baseline="middle">Lettuce (Redis Client)</text><text class="mono" x="580" y="333" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">SETNX key, TTL=60s</text><text class="mono" x="580" y="349" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">periodic heartbeat</text>
<rect x="734" y="306" width="180" height="50" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="824" y="315" text-anchor="middle" dominant-baseline="middle">Redis Server</text><text class="mono" x="824" y="333" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">Leader key storage</text><text class="mono" x="824" y="349" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">cluster-safe</text>
<rect x="68" y="392" width="240" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="188" y="401" text-anchor="middle" dominant-baseline="middle">CircuitBreaker</text><text class="mono" x="188" y="419" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">failure rate threshold 50%</text><text class="mono" x="188" y="435" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">30s open state wait</text>
<rect x="330" y="392" width="200" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="430" y="401" text-anchor="middle" dominant-baseline="middle">Retry</text><text class="mono" x="430" y="419" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">max 3 attempts</text><text class="mono" x="430" y="435" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">1s wait between</text>
<rect x="552" y="392" width="200" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="652" y="401" text-anchor="middle" dominant-baseline="middle">Bulkhead</text><text class="mono" x="652" y="419" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">max 10 concurrent calls</text><text class="mono" x="652" y="435" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">prevents cascade</text>
<rect x="774" y="392" width="200" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="874" y="401" text-anchor="middle" dominant-baseline="middle">ResilientNotificationChannel</text><text class="mono" x="874" y="419" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">wraps channel</text><text class="mono" x="874" y="435" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">with all 3 guards</text>
<rect x="68" y="478" width="280" height="50" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="208" y="487" text-anchor="middle" dominant-baseline="middle">DummyNotificationChannel</text><text class="mono" x="208" y="505" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">logs + stores history</text><text class="mono" x="208" y="521" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">always returns SUCCESS</text>
<rect x="380" y="478" width="280" height="50" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="520" y="479" text-anchor="middle" dominant-baseline="middle">Future: KakaoTalk</text><text class="smallLabel" x="520" y="497" text-anchor="middle" dominant-baseline="middle">Email, SMS Channels</text><text class="mono" x="520" y="515" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">implement NotificationChannel</text><text class="mono" x="520" y="531" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">interface</text>
<rect x="692" y="478" width="220" height="50" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="802" y="487" text-anchor="middle" dominant-baseline="middle">NotificationHistoryRepository</text><text class="mono" x="802" y="505" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">Exposed table</text><text class="mono" x="802" y="521" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">stores send history</text>
<rect x="68" y="560" width="280" height="30" rx="10" fill="#F2F5F9" stroke="#9AA8B8" class="card"/><text class="smallLabel" x="208" y="575" text-anchor="middle" dominant-baseline="middle">notification_history (PostgreSQL)</text>
<rect x="380" y="560" width="260" height="30" rx="10" fill="#F2F5F9" stroke="#9AA8B8" class="card"/><text class="smallLabel" x="510" y="575" text-anchor="middle" dominant-baseline="middle">event_logs (appointment-event)</text>
