<text class="title" x="1000" y="104" text-anchor="middle">HA Notification Architecture</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">Separate event delivery from leader-elected reminder delivery and failure isolation.</text>
<rect class="panel" x="105" y="205" width="410" height="580" rx="24" fill="#eef6ff" stroke="#b7d2f4"/><text class="panel-title" x="133" y="247">Event-driven path</text>
