<rect x="68" y="214" width="300" height="50" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="218" y="215" text-anchor="middle" dominant-baseline="middle">AppointmentPlanning (@PlanningEntity)</text><text class="mono" x="218" y="233" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">doctorId, appointmentDate</text><text class="mono" x="218" y="249" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">startTime = planning variables</text><text class="mono" x="218" y="265" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">Pinned if CONFIRMED+</text>
