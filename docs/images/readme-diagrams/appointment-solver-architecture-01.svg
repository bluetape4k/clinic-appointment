<rect class="note" x="260" y="890" width="1480" height="58" rx="16"/><text class="footer" x="1000" y="926" text-anchor="middle">Source note: AppointmentConstraintProvider currently registers 12 hard constraints and 6 soft constraints; README prose was corrected to match code.</text>
