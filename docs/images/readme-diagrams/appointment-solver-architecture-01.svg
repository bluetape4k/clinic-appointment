<rect x="350" y="296" width="200" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="450" y="305" text-anchor="middle" dominant-baseline="middle">Soft Constraints (2)</text><text class="mono" x="450" y="323" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">doctor load balance</text><text class="mono" x="450" y="339" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">schedule gap minimize</text>
<rect x="572" y="296" width="260" height="50" rx="10" fill="#FFF3D9" stroke="#D6A441" class="card"/><text class="smallLabel" x="702" y="305" text-anchor="middle" dominant-baseline="middle">AppointmentConstraintProvider</text><text class="mono" x="702" y="323" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">Timefold ConstraintProvider</text><text class="mono" x="702" y="339" text-anchor="middle" dominant-baseline="middle" fill="#4A3000" opacity="0.75">H1–H11, S1–S2</text>
<rect x="68" y="378" width="200" height="50" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="168" y="387" text-anchor="middle" dominant-baseline="middle">SolverConfig</text><text class="mono" x="168" y="405" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">termination config</text><text class="mono" x="168" y="421" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">move filters</text>
<rect x="290" y="378" width="300" height="50" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="440" y="387" text-anchor="middle" dominant-baseline="middle">Timefold Solver Engine</text><text class="mono" x="440" y="405" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">local search · tabu search</text><text class="mono" x="440" y="421" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">score evaluation · SSA</text>
<rect x="612" y="378" width="200" height="50" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="712" y="387" text-anchor="middle" dominant-baseline="middle">BestSolution</text><text class="mono" x="712" y="405" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">optimized assignments</text><text class="mono" x="712" y="421" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">HardSoftScore</text>
<rect x="68" y="460" width="300" height="50" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="218" y="469" text-anchor="middle" dominant-baseline="middle">SolverResult</text><text class="mono" x="218" y="487" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">assignments: Map&lt;Long, Assignment&gt;</text><text class="mono" x="218" y="503" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">appointmentId → (doctorId, date, time)</text>
<rect x="390" y="460" width="280" height="50" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="530" y="469" text-anchor="middle" dominant-baseline="middle">Caller (SolverController)</text><text class="mono" x="530" y="487" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">receives SolverResult</text><text class="mono" x="530" y="503" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">calls AppointmentRepository.save()</text>
<rect x="692" y="460" width="200" height="50" rx="10" fill="#F2F5F9" stroke="#9AA8B8" class="card"/><text class="smallLabel" x="792" y="469" text-anchor="middle" dominant-baseline="middle">DB: PostgreSQL</text><text class="mono" x="792" y="487" text-anchor="middle" dominant-baseline="middle" fill="#2A3340" opacity="0.75">updated appointments</text><text class="mono" x="792" y="503" text-anchor="middle" dominant-baseline="middle" fill="#2A3340" opacity="0.75">Exposed JDBC transaction</text>
