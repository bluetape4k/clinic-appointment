<rect x="530" y="132" width="200" height="50" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="630" y="133" text-anchor="middle" dominant-baseline="middle">Problem Facts</text><text class="mono" x="630" y="151" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">Doctors, Clinics</text><text class="mono" x="630" y="167" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">ClosureRecords, Holidays</text><text class="mono" x="630" y="183" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">EquipUnavailabilities</text>
