<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">예약 신뢰도 자격 판단 시퀀스</title><desc id="desc">새 예약 요청이 정책 snapshot과 제한된 사건을 평가한 뒤 확정 예약을 보호하는 흐름.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#287f86"/></marker><style>text{font-family:"Apple SD Gothic Neo",Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;fill:#17263a}.frame{fill:#fff;stroke:#bdcad8;stroke-width:2}.title{font-size:28px;font-weight:800}.sub,.subtitle{font-size:14px;fill:#53677d}.actor{fill:#e9f7f6;stroke:#287f86;stroke-width:2}.participant{font-size:15px;font-weight:700}.life{stroke:#9fb0c2;stroke-width:2;stroke-dasharray:7 6}.activation{fill:#c9ece9;stroke:#287f86;stroke-width:1}.msg{stroke:#287f86;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.return{stroke:#996000;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700}.num{font-size:12px;font-weight:800;fill:#287f86}.pill{fill:#fff;stroke:#bdcad8;stroke-width:1}.note{fill:#fff;stroke:#bdcad8}</style></defs>
  <rect width="1200" height="720" fill="#eef4fb"/><rect class="frame" x="32" y="24" width="1136" height="640" rx="24"/><text class="title" x="56" y="56">예약 신뢰도 · 자격 판단 시퀀스</text><text class="subtitle" x="56" y="82">새 예약·가예약 경로만 gate를 적용하며 기존 CONFIRMED는 그대로 둡니다.</text>
  <g><rect class="actor" x="65" y="125" width="150" height="56" rx="12"/><text class="participant" x="140" y="159" text-anchor="middle">예약 API</text><line class="life" x1="140" y1="181" x2="140" y2="625"/>
  <rect class="actor" x="315" y="125" width="170" height="56" rx="12"/><text class="participant" x="400" y="159" text-anchor="middle">자격 gate</text><line class="life" x1="400" y1="181" x2="400" y2="625"/>
  <rect class="actor" x="585" y="125" width="170" height="56" rx="12"/><text class="participant" x="670" y="159" text-anchor="middle">순수 evaluator</text><line class="life" x1="670" y1="181" x2="670" y2="625"/>
  <rect class="actor" x="855" y="125" width="170" height="56" rx="12"/><text class="participant" x="940" y="159" text-anchor="middle">정책 + 사건 저장소</text><line class="life" x1="940" y1="181" x2="940" y2="625"/>
  <rect class="activation" x="388" y="210" width="24" height="320" rx="5"/><rect class="activation" x="658" y="265" width="24" height="210" rx="5"/>
  <path class="msg" d="M140 230 H400"/><rect class="pill" x="195" y="196" width="150" height="28" rx="14"/><text class="num" x="207" y="215">1</text><text class="label" x="270" y="215" text-anchor="middle">생성 / hold 요청</text><path class="msg" d="M400 285 H670"/><rect class="pill" x="475" y="251" width="120" height="28" rx="14"/><text class="num" x="487" y="270">2</text><text class="label" x="535" y="270" text-anchor="middle">evaluate(query)</text><path class="msg" d="M670 340 H940"/><rect class="pill" x="710" y="306" width="190" height="28" rx="14"/><text class="num" x="722" y="325">3</text><text class="label" x="805" y="325" text-anchor="middle">snapshot + 제한 이력</text><path class="return" d="M940 400 H670"/><rect class="pill" x="710" y="366" width="190" height="28" rx="14"/><text class="num" x="722" y="385">4</text><text class="label" x="805" y="385" text-anchor="middle">정책 + 중복 제거 이력</text><path class="return" d="M670 455 H400"/><rect class="pill" x="455" y="421" width="160" height="28" rx="14"/><text class="num" x="467" y="440">5</text><text class="label" x="535" y="440" text-anchor="middle">결정 + digest + 만료</text><path class="return" d="M400 510 H140"/><rect class="pill" x="180" y="476" width="180" height="28" rx="14"/><text class="num" x="192" y="495">6</text><text class="label" x="270" y="495" text-anchor="middle">허용 / 검토 / 판단 불가</text>
  <rect class="note" x="180" y="560" width="840" height="72" rx="12"/><text class="sub" x="600" y="590" text-anchor="middle">ENFORCE에서는 제한·stale·unavailable 신규 경로를 거부합니다.</text><text class="sub" x="600" y="614" text-anchor="middle">이 evaluator가 기존 CONFIRMED 예약을 취소하거나 이동시키지 않습니다.</text></g>
</svg>
