<text class="layerTitle" x="472" y="338" dominant-baseline="middle">Subscribers</text>
<rect x="68" y="148" width="280" height="64" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="208" y="156" text-anchor="middle" dominant-baseline="middle">AppointmentController</text><text class="mono" x="208" y="174" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">POST /appointments</text><text class="mono" x="208" y="190" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">PATCH .../status</text><text class="mono" x="208" y="206" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">DELETE .../cancel</text>
<rect x="68" y="228" width="280" height="64" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="208" y="244" text-anchor="middle" dominant-baseline="middle">RescheduleController</text><text class="mono" x="208" y="262" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">POST .../reschedule</text><text class="mono" x="208" y="278" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">batch reschedule stream</text>
<rect x="68" y="308" width="280" height="64" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="208" y="324" text-anchor="middle" dominant-baseline="middle">SlotController</text><text class="mono" x="208" y="342" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">slot query triggers</text><text class="mono" x="208" y="358" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">availability events</text>
<rect x="68" y="392" width="280" height="64" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="208" y="408" text-anchor="middle" dominant-baseline="middle">Domain Services</text><text class="mono" x="208" y="426" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">ClosureRescheduleService</text><text class="mono" x="208" y="442" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">ConcurrencyResolver</text>
<rect x="478" y="148" width="180" height="52" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="568" y="166" text-anchor="middle" dominant-baseline="middle">Created</text><text class="mono" x="568" y="184" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">appointmentId, clinicId</text>
<rect x="678" y="148" width="180" height="52" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="768" y="166" text-anchor="middle" dominant-baseline="middle">StatusChanged</text><text class="mono" x="768" y="184" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">fromState → toState</text>
<rect x="478" y="218" width="180" height="52" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="568" y="236" text-anchor="middle" dominant-baseline="middle">Cancelled</text><text class="mono" x="568" y="254" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">appointmentId, reason</text>
<rect x="678" y="218" width="180" height="52" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="768" y="236" text-anchor="middle" dominant-baseline="middle">Rescheduled</text><text class="mono" x="768" y="254" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">originalId, newId</text>
<rect x="478" y="348" width="180" height="64" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="568" y="364" text-anchor="middle" dominant-baseline="middle">AppointmentEventLogger</text><text class="mono" x="568" y="382" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">@EventListener</text><text class="mono" x="568" y="398" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">persists to EventLog DB</text>
<rect x="678" y="348" width="180" height="64" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="768" y="364" text-anchor="middle" dominant-baseline="middle">NotificationEventListener</text><text class="mono" x="768" y="382" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">@EventListener</text><text class="mono" x="768" y="398" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">calls NotificationChannel</text>
<rect x="478" y="432" width="180" height="52" rx="10" fill="#F2F5F9" stroke="#9AA8B8" class="card"/><text class="smallLabel" x="568" y="442" text-anchor="middle" dominant-baseline="middle">AppointmentEventLogs</text><text class="mono" x="568" y="460" text-anchor="middle" dominant-baseline="middle" fill="#2A3340" opacity="0.75">Exposed table</text><text class="mono" x="568" y="476" text-anchor="middle" dominant-baseline="middle" fill="#2A3340" opacity="0.75">event_type, payload_json</text>
