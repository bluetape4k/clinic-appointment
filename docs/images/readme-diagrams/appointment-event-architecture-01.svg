<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="850" viewBox="0 0 2000 850" role="img" aria-label="Appointment Event Architecture">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#27415f" flood-opacity="0.12"/></filter>
  <marker id="arrow-blue" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4f77c9" stroke="#4f77c9"/></marker>
<marker id="arrow-cyan" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4aa6b5" stroke="#4aa6b5"/></marker>
<marker id="arrow-teal" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#2f9f93" stroke="#2f9f93"/></marker>
<marker id="arrow-green" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#3c987e" stroke="#3c987e"/></marker>
<marker id="arrow-amber" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d28a28" stroke="#d28a28"/></marker>
<marker id="arrow-orange" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d9823b" stroke="#d9823b"/></marker>
<marker id="arrow-pink" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d85f8d" stroke="#d85f8d"/></marker>
<marker id="arrow-purple" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#8a65d8" stroke="#8a65d8"/></marker>
<marker id="arrow-red" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#ca5f66" stroke="#ca5f66"/></marker>
<marker id="arrow-slate" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#718096" stroke="#718096"/></marker>
  <style>
    svg{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#f6f9fc}.frame{fill:#ffffff;stroke:#c4d5e8;stroke-width:3;filter:url(#shadow)}
    .title,.panel-title,.card-title,.state-title{font-family:"Architects Daughter","Comic Sans MS",cursive;fill:#263a57}
    .title{font-size:46px}.subtitle{font-size:17px;fill:#526276}.panel-title{font-size:27px}.card-title{font-size:24px}.state-title{font-size:22px}
    .detail,.small,.pill-text,.route-label,.footer{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif;fill:#526276}
    .detail{font-size:14px}.small{font-size:12px}.pill-text{font-size:13px}.route-label{font-size:13px}.footer{font-size:14px}
    .panel{stroke-width:2}.card{stroke-width:2.4;filter:url(#shadow)}.pill{stroke-width:1.8}.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#b7c8dc;stroke-width:2;stroke-dasharray:8 8}.message{fill:none;stroke-width:3;stroke-linecap:round}.note{fill:#fffdf7;stroke:#d7b970;stroke-width:2}
    .table{stroke-width:2.2;filter:url(#shadow)}.table-head{font-family:"Architects Daughter";font-size:21px;fill:#263a57}.row{font-size:12.5px;fill:#526276}
  </style>
</defs>
<rect class="canvas" width="2000" height="850"/>
<rect class="frame" x="48" y="42" width="1904" height="766" rx="34"/>
<text class="title" x="1000" y="104" text-anchor="middle">Appointment Event Architecture</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">Spring ApplicationEvent fans out to durable logging and downstream notification subscribers.</text>
<g id="publisher"><rect class="card" x="120" y="310" width="320" height="130" rx="16" fill="#fff" stroke="#4f77c9"/><g transform="translate(138 328)"><rect width="44" height="44" rx="10" fill="#4f77c9"/><g fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="196" y="350">API or service</text><text class="detail" x="144" y="384" text-anchor="start"><tspan x="144" dy="0">Publishes Created, StatusChanged,</tspan><tspan x="144" dy="19">Cancelled, Rescheduled</tspan></text></g>
<g id="event"><rect class="card" x="560" y="280" width="360" height="180" rx="16" fill="#fff" stroke="#d28a28"/><g transform="translate(578 298)"><rect width="44" height="44" rx="10" fill="#d28a28"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 16h20M12 22h20M12 28h20"/><path d="M27 11l6 5-6 5M27 23l6 5-6 5"/></g></g><text class="card-title" x="636" y="320">AppointmentDomainEvent</text><text class="detail" x="584" y="354" text-anchor="start"><tspan x="584" dy="0">sealed event hierarchy</tspan></text><text class="detail" x="584" y="392" text-anchor="start"><tspan x="584" dy="0">occurredAt is captured at creation</tspan></text></g>
<g id="logger"><rect class="card" x="1060" y="230" width="360" height="145" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(1078 248)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="1136" y="270">AppointmentEventLogger</text><text class="detail" x="1084" y="304" text-anchor="start"><tspan x="1084" dy="0">@EventListener persists every event as</tspan><tspan x="1084" dy="19">JSON payload</tspan></text></g>
<g id="notif"><rect class="card" x="1060" y="480" width="360" height="145" rx="16" fill="#fff" stroke="#ca5f66"/><g transform="translate(1078 498)"><rect width="44" height="44" rx="10" fill="#ca5f66"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 16h20M12 22h20M12 28h20"/><path d="M27 11l6 5-6 5M27 23l6 5-6 5"/></g></g><text class="card-title" x="1136" y="520">Notification listener</text><text class="detail" x="1084" y="554" text-anchor="start"><tspan x="1084" dy="0">Subscribes to event types and loads</tspan><tspan x="1084" dy="19">current appointment</tspan></text></g>
<g id="logdb"><rect class="card" x="1540" y="230" width="300" height="145" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(1558 248)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="1616" y="270">Event log table</text><text class="detail" x="1564" y="304" text-anchor="start"><tspan x="1564" dy="0">scheduling_appointment_event_logs</tspan></text></g>
<g id="channel"><rect class="card" x="1540" y="480" width="300" height="145" rx="16" fill="#fff" stroke="#ca5f66"/><g transform="translate(1558 498)"><rect width="44" height="44" rx="10" fill="#ca5f66"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="1616" y="520">Notification module</text><text class="detail" x="1564" y="554" text-anchor="start"><tspan x="1564" dy="0">Delivery is delegated, not</tspan><tspan x="1564" dy="19">handled by appointment-event</tspan></text></g>
<path class="route" d="M440 375 L560 375" stroke="#4f77c9" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
<path class="route" d="M920 335 L976.0 335.0 Q990 335 990.0 321.0 L990.0 317.0 Q990 303 1004.0 303.0 L1060 303" stroke="#3c987e" stroke-width="3.2" marker-end="url(#arrow-green)"/>
<path class="route" d="M920 405 L976.0 405.0 Q990 405 990.0 419.0 L990.0 539.0 Q990 553 1004.0 553.0 L1060 553" stroke="#ca5f66" stroke-width="3.2" marker-end="url(#arrow-red)"/>
<path class="route" d="M1420 303 L1540 303" stroke="#3c987e" stroke-width="3.2" marker-end="url(#arrow-green)"/>
<path class="route" d="M1420 553 L1540 553" stroke="#ca5f66" stroke-width="3.2" marker-end="url(#arrow-red)"/>
<rect class="note" x="260" y="720" width="1480" height="58" rx="16"/><text class="footer" x="1000" y="756" text-anchor="middle">appointment-event owns event definitions and event-log persistence only; notification delivery remains a subscriber concern.</text>
</svg>