<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">예약 신뢰도 영속 모델 ERD</title><desc id="desc">신뢰 이벤트, 불변 결정, 직원 override, 재평가 작업을 분리한 네 테이블 관계.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,3 L0,6 Z" fill="#287f86" stroke-dasharray="none"/></marker><style>text{font-family:"Apple SD Gothic Neo",Inter,Pretendard,system-ui,sans-serif;fill:#17263a;stroke:none}.title{font-size:28px;font-weight:800}.sub{font-size:14px;fill:#53677d}.card{fill:#fff;stroke:#287f86;stroke-width:2}.head{fill:#e9f7f6}.field{font-size:14px}.edge{stroke:#287f86;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="680" fill="#eef4fb"/><text class="title" x="60" y="58">예약 신뢰도 · 영속 경계</text><text class="sub" x="60" y="84">불투명 MemberId만 저장 · tenant/clinic 범위 · additive V17 스키마</text>
  <g class="card"><rect x="60" y="140" width="310" height="300" rx="16"/><rect class="head" x="60" y="140" width="310" height="54" rx="16"/><text x="82" y="174" font-size="20" font-weight="800">booking_reliability_events</text><text class="field" x="82" y="225">event_id · appointment_id</text><text class="field" x="82" y="252">tenant_group_id · clinic_id · member_id</text><text class="field" x="82" y="279">event_type · responsibility · source</text><text class="field" x="82" y="306">occurred_at · source_version</text><text class="field" x="82" y="333">event_hash · correlation_id</text><text class="field" x="82" y="360">retention_class · created_at</text><text class="sub" x="82" y="405">이벤트 유일키 + keyset 인덱스</text></g>
  <g class="card"><rect x="445" y="140" width="310" height="300" rx="16"/><rect class="head" x="445" y="140" width="310" height="54" rx="16"/><text x="467" y="174" font-size="20" font-weight="800">booking_reliability_decisions</text><text class="field" x="467" y="225">decision_id · evaluation_digest</text><text class="field" x="467" y="252">policy_snapshot_id · policy_version</text><text class="field" x="467" y="279">decision · bounded count</text><text class="field" x="467" y="306">reason_codes · trigger_ids</text><text class="field" x="467" y="333">effective_from · expires_at</text><text class="field" x="467" y="360">correlation_id · created_at</text><text class="sub" x="467" y="405">불변 결정 + digest 멱등성</text></g>
  <g class="card"><rect x="830" y="140" width="310" height="300" rx="16"/><rect class="head" x="830" y="140" width="310" height="54" rx="16"/><text x="852" y="174" font-size="20" font-weight="800">overrides + reevaluation_jobs</text><text class="field" x="852" y="225">override_id · action · actor</text><text class="field" x="852" y="252">previous_digest · reason_code</text><text class="field" x="852" y="279">effective/expires · CAS version</text><text class="field" x="852" y="324">job_id · cursor · status</text><text class="field" x="852" y="351">lease_owner · next_attempt_at</text><text class="field" x="852" y="378">attempt_count · last_error_code</text><text class="sub" x="852" y="405">append-only 감사 + 내구성 작업</text></g>
  <path class="edge" d="M370 290 L445 290"/><text class="sub" x="382" y="274">사건 사실</text><path class="edge" d="M755 290 L830 290"/><text class="sub" x="772" y="274">감사 / 작업</text>
  <rect x="60" y="500" width="1080" height="100" rx="16" fill="#fff" stroke="#bdcad8"/><text x="84" y="538" font-size="17" font-weight="800">안전 불변식</text><text class="sub" x="84" y="566">프로필 필드·연락처 원문을 저장하지 않으며, 기존 CONFIRMED 약속을 변경하지 않고 모든 쓰기는 호출자 transaction 안에서 수행합니다.</text>
</svg>
