<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Booking reliability class boundary</title><desc id="desc">Core evaluator, port, decision record, and API gate collaborate without copying profile data.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,3 L0,6 Z" fill="#287f86" stroke-dasharray="none"/></marker><style>text{font-family:Inter,Pretendard,system-ui,sans-serif;fill:#17263a;stroke:none}.title{font-size:28px;font-weight:800}.sub{font-size:14px;fill:#53677d}.box{fill:#fff;stroke:#287f86;stroke-width:2}.head{fill:#e9f7f6}.line{stroke:#bdcad8}.rel{stroke:#287f86;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.name{font-size:19px;font-weight:800}.member{font-size:14px}.small{font-size:13px;fill:#53677d}</style></defs>
  <rect width="1200" height="680" fill="#eef4fb"/><text class="title" x="60" y="58">Booking reliability · class boundary</text><text class="sub" x="60" y="84">Core owns the pure decision contract; API owns mode, authorization, and caller-safe errors.</text>
  <g class="box"><rect x="60" y="150" width="300" height="260" rx="14"/><rect class="head" x="60" y="150" width="300" height="55" rx="14"/><text class="name" x="82" y="184">BookingReliabilityEvaluator</text><line class="line" x1="60" y1="205" x2="360" y2="205"/><text class="member" x="82" y="237">+ evaluate(query, snapshot, events)</text><text class="member" x="82" y="266">+ deduplicate(sourceVersion)</text><text class="member" x="82" y="295">+ countPatientResponsibility()</text><text class="member" x="82" y="324">+ decisionDigest()</text><text class="small" x="82" y="370">pure · bounded · deterministic</text></g>
  <g class="box"><rect x="450" y="150" width="300" height="260" rx="14"/><rect class="head" x="450" y="150" width="300" height="55" rx="14"/><text class="name" x="472" y="184">BookingEligibilityPort</text><line class="line" x1="450" y1="205" x2="750" y2="205"/><text class="member" x="472" y="237">+ evaluate(query): ReadResult</text><text class="member" x="472" y="266">+ Available(decision)</text><text class="member" x="472" y="295">+ Stale(snapshot, decision)</text><text class="member" x="472" y="324">+ Unavailable(reason)</text><text class="small" x="472" y="370">read-only consumer contract</text></g>
  <g class="box"><rect x="840" y="150" width="300" height="260" rx="14"/><rect class="head" x="840" y="150" width="300" height="55" rx="14"/><text class="name" x="862" y="184">BookingEligibilityGate</text><line class="line" x1="840" y1="205" x2="1140" y2="205"/><text class="member" x="862" y="237">+ enforce(mode, clinic, decision)</text><text class="member" x="862" y="266">+ OFF / SHADOW / ENFORCE</text><text class="member" x="862" y="295">+ allow PROPOSED / HELD</text><text class="member" x="862" y="324">+ preserve CONFIRMED</text><text class="small" x="862" y="370">caller-safe outcome mapping</text></g>
  <path class="rel" d="M360 280 H450"/><text class="small" x="405" y="266" text-anchor="middle">implements</text><path class="rel" d="M750 310 H840"/><text class="small" x="795" y="296" text-anchor="middle">consumes</text><rect x="220" y="500" width="760" height="76" rx="14" fill="#fff" stroke="#bdcad8"/><text class="sub" x="600" y="530" text-anchor="middle">DecisionRecord carries policy snapshot, bounded counts, reasons, expiry, and digest.</text><text class="sub" x="600" y="554" text-anchor="middle">Neither the core model nor the gate loads a name, phone number, or free-text profile note.</text>
</svg>
