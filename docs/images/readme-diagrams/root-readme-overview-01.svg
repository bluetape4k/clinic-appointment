<rect class="canvas" width="2000" height="960"/>
<rect class="frame" x="48" y="42" width="1904" height="876" rx="34"/>
<text class="title" x="1000" y="104" text-anchor="middle">Clinic Appointment Module Overview</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">A source-backed map of module ownership and dependency direction.</text>
<g id="root"><rect class="card" x="750" y="230" width="460" height="130" rx="16" fill="#f7fee7" stroke="#65a30d"/><g transform="translate(768 248)"><rect width="44" height="44" rx="10" fill="#65a30d"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="826" y="270">clinic-appointment</text><text class="small" x="1188" y="270" text-anchor="end">Kotlin 2.3 / Java 25</text><text class="detail" x="774" y="304" text-anchor="start"><tspan x="774" dy="0">End-to-end example app: domain scheduling, Solver,</tspan><tspan x="774" dy="19">notifications, API, and Angular UI</tspan></text></g>
<g id="core"><rect class="card" x="130" y="465" width="330" height="115" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(148 483)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="206" y="505">appointment-core</text><text class="detail" x="154" y="539" text-anchor="start"><tspan x="154" dy="0">Leaf domain module: tables,</tspan><tspan x="154" dy="19">repositories, state machine, slots</tspan></text></g>
<g id="event"><rect class="card" x="530" y="465" width="330" height="115" rx="16" fill="#fff" stroke="#d28a28"/><g transform="translate(548 483)"><rect width="44" height="44" rx="10" fill="#d28a28"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 16h20M12 22h20M12 28h20"/><path d="M27 11l6 5-6 5M27 23l6 5-6 5"/></g></g><text class="card-title" x="606" y="505">appointment-event</text><text class="detail" x="554" y="539" text-anchor="start"><tspan x="554" dy="0">Spring events plus durable event</tspan><tspan x="554" dy="19">log table</tspan></text></g>
<g id="solver"><rect class="card" x="930" y="465" width="330" height="115" rx="16" fill="#fff" stroke="#8a65d8"/><g transform="translate(948 483)"><rect width="44" height="44" rx="10" fill="#8a65d8"/><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M16 28c-4-2-5-9 1-12 2-7 13-5 13 3 5 2 4 11-2 12"/><path d="M19 18v12M25 17v14"/></g></g><text class="card-title" x="1006" y="505">appointment-solver</text><text class="detail" x="954" y="539" text-anchor="start"><tspan x="954" dy="0">Timefold batch placement from core</tspan><tspan x="954" dy="19">records</tspan></text></g>
<g id="notification"><rect class="card" x="1330" y="465" width="390" height="115" rx="16" fill="#fff" stroke="#ca5f66"/><g transform="translate(1348 483)"><rect width="44" height="44" rx="10" fill="#ca5f66"/><g fill="none" stroke="#fff" stroke-width="2.4"><rect x="12" y="20" width="20" height="14" rx="3"/><path d="M16 20v-5a6 6 0 0 1 12 0v5"/></g></g><text class="card-title" x="1406" y="505">appointment-notification</text><text class="detail" x="1354" y="539" text-anchor="start"><tspan x="1354" dy="0">Event-driven messages and leader-elected</tspan><tspan x="1354" dy="19">reminders</tspan></text></g>
<g id="api"><rect class="card" x="430" y="680" width="420" height="115" rx="16" fill="#fff" stroke="#4f77c9"/><g transform="translate(448 698)"><rect width="44" height="44" rx="10" fill="#4f77c9"/><g fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="506" y="720">appointment-api</text><text class="detail" x="454" y="754" text-anchor="start"><tspan x="454" dy="0">Spring MVC, JWT tenant checks, Flyway,</tspan><tspan x="454" dy="19">Swagger, SSE</tspan></text></g>
<g id="frontend"><rect class="card" x="1050" y="680" width="420" height="115" rx="16" fill="#fff" stroke="#4aa6b5"/><g transform="translate(1068 698)"><rect width="44" height="44" rx="10" fill="#4aa6b5"/><g fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="1126" y="720">frontend</text><text class="detail" x="1074" y="754" text-anchor="start"><tspan x="1074" dy="0">Angular UI consumes tenant-scoped REST APIs</tspan></text></g>
