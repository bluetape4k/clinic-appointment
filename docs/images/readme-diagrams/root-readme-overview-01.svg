<marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 15 15" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#3c987e" stroke="#3c987e" stroke-dasharray="none"/></marker>
