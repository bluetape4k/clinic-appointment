<rect class="note" x="250" y="835" width="1500" height="52" rx="16"/><text class="footer" x="1000" y="868" text-anchor="middle">Dependency direction is intentionally inward: application modules use appointment-core; notification subscribes to events; frontend talks only to the API.</text>
