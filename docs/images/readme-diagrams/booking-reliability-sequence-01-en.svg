<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Booking reliability eligibility sequence</title><desc id="desc">A new booking asks for a decision, the evaluator reads a policy snapshot and bounded events, and the gate protects confirmed commitments.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#287f86"/></marker><style>text{font-family:Inter,Pretendard,system-ui,sans-serif;fill:#17263a}.frame{fill:#fff;stroke:#bdcad8;stroke-width:2}.title{font-size:28px;font-weight:800}.sub,.subtitle{font-size:14px;fill:#53677d}.actor{fill:#e9f7f6;stroke:#287f86;stroke-width:2}.participant{font-size:15px;font-weight:700}.life{stroke:#9fb0c2;stroke-width:2;stroke-dasharray:7 6}.activation{fill:#c9ece9;stroke:#287f86;stroke-width:1}.msg{stroke:#287f86;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.return{stroke:#996000;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:700}.num{font-size:12px;font-weight:800;fill:#287f86}.pill{fill:#fff;stroke:#bdcad8;stroke-width:1}.note{fill:#fff;stroke:#bdcad8}</style></defs>
  <rect width="1200" height="720" fill="#eef4fb"/><rect class="frame" x="32" y="24" width="1136" height="640" rx="24"/><text class="title" x="56" y="56">Booking reliability · eligibility sequence</text><text class="subtitle" x="56" y="82">Only new/provisional booking paths are gated; existing CONFIRMED stays untouched.</text>
  <g><rect class="actor" x="65" y="125" width="150" height="56" rx="12"/><text class="participant" x="140" y="159" text-anchor="middle">Booking API</text><line class="life" x1="140" y1="181" x2="140" y2="625"/>
  <rect class="actor" x="315" y="125" width="170" height="56" rx="12"/><text class="participant" x="400" y="159" text-anchor="middle">Eligibility gate</text><line class="life" x1="400" y1="181" x2="400" y2="625"/>
  <rect class="actor" x="585" y="125" width="170" height="56" rx="12"/><text class="participant" x="670" y="159" text-anchor="middle">Pure evaluator</text><line class="life" x1="670" y1="181" x2="670" y2="625"/>
  <rect class="actor" x="855" y="125" width="170" height="56" rx="12"/><text class="participant" x="940" y="159" text-anchor="middle">Policy + event store</text><line class="life" x1="940" y1="181" x2="940" y2="625"/>
  <rect class="activation" x="388" y="210" width="24" height="320" rx="5"/><rect class="activation" x="658" y="265" width="24" height="210" rx="5"/>
  <path class="msg" d="M140 230 H400"/><rect class="pill" x="195" y="196" width="150" height="28" rx="14"/><text class="num" x="207" y="215">1</text><text class="label" x="270" y="215" text-anchor="middle">create / hold request</text><path class="msg" d="M400 285 H670"/><rect class="pill" x="475" y="251" width="120" height="28" rx="14"/><text class="num" x="487" y="270">2</text><text class="label" x="535" y="270" text-anchor="middle">evaluate(query)</text><path class="msg" d="M670 340 H940"/><rect class="pill" x="710" y="306" width="190" height="28" rx="14"/><text class="num" x="722" y="325">3</text><text class="label" x="805" y="325" text-anchor="middle">snapshot + bounded events</text><path class="return" d="M940 400 H670"/><rect class="pill" x="710" y="366" width="190" height="28" rx="14"/><text class="num" x="722" y="385">4</text><text class="label" x="805" y="385" text-anchor="middle">policy + deduped history</text><path class="return" d="M670 455 H400"/><rect class="pill" x="455" y="421" width="160" height="28" rx="14"/><text class="num" x="467" y="440">5</text><text class="label" x="535" y="440" text-anchor="middle">decision + digest + expiry</text><path class="return" d="M400 510 H140"/><rect class="pill" x="180" y="476" width="180" height="28" rx="14"/><text class="num" x="192" y="495">6</text><text class="label" x="270" y="495" text-anchor="middle">allow / review / unavailable</text>
  <rect class="note" x="180" y="560" width="840" height="72" rx="12"/><text class="sub" x="600" y="590" text-anchor="middle">ENFORCE rejects restricted, stale, and unavailable new paths.</text><text class="sub" x="600" y="614" text-anchor="middle">A CONFIRMED appointment is never cancelled or moved by this evaluator.</text></g>
</svg>
