<rect x="410" y="610" width="170" height="52" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="495" y="628" text-anchor="middle" dominant-baseline="middle">COMPLETED</text><text class="mono" x="495" y="646" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">진료 완료</text>
<rect x="660" y="310" width="170" height="52" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="745" y="328" text-anchor="middle" dominant-baseline="middle">NO_SHOW</text><text class="mono" x="745" y="346" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">미내원</text>
<rect x="660" y="430" width="170" height="52" rx="10" fill="#F1ECFF" stroke="#8A72D6" class="card"/><text class="smallLabel" x="745" y="448" text-anchor="middle" dominant-baseline="middle">PENDING_RESCHEDULE</text><text class="mono" x="745" y="466" text-anchor="middle" dominant-baseline="middle" fill="#2A1A5C" opacity="0.75">재배정 대기</text>
<rect x="660" y="530" width="170" height="52" rx="10" fill="#E9F7F6" stroke="#45A7A1" class="card"/><text class="smallLabel" x="745" y="548" text-anchor="middle" dominant-baseline="middle">RESCHEDULED</text><text class="mono" x="745" y="566" text-anchor="middle" dominant-baseline="middle" fill="#0E3533" opacity="0.75">재배정 완료</text>
<rect x="150" y="500" width="180" height="52" rx="10" fill="#FDECEF" stroke="#DC6B82" class="card"/><text class="smallLabel" x="240" y="518" text-anchor="middle" dominant-baseline="middle">CANCELLED</text><text class="mono" x="240" y="536" text-anchor="middle" dominant-baseline="middle" fill="#4A0E1C" opacity="0.75">취소 (모든 상태에서 가능)</text>
<path class="line-blue" d="M495 182 L495 230"/>
