<rect x="410" y="230" width="170" height="52" rx="10" fill="#E8F3FF" stroke="#5B8DEF" class="card"/><text class="smallLabel" x="495" y="248" text-anchor="middle" dominant-baseline="middle">REQUESTED</text><text class="mono" x="495" y="266" text-anchor="middle" dominant-baseline="middle" fill="#1A3A5C" opacity="0.75">예약 요청</text>
<rect x="410" y="330" width="170" height="52" rx="10" fill="#EAF7EF" stroke="#58A978" class="card"/><text class="smallLabel" x="495" y="348" text-anchor="middle" dominant-baseline="middle">CONFIRMED</text><text class="mono" x="495" y="366" text-anchor="middle" dominant-baseline="middle" fill="#1A3A26" opacity="0.75">예약 확정</text>
