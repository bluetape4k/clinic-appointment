<text class="small" x="807" y="370" fill="#4A3000">IN_PROGRESS, COMPLETED</text>
<text class="small" x="807" y="390" fill="#D6A441">→ Solver cannot move</text>
<text class="small" x="807" y="410" fill="#45A7A1">Movable: REQUESTED,</text>
<text class="small" x="807" y="428" fill="#45A7A1">PENDING_RESCHEDULE</text>
<text class="small" x="500" y="652" text-anchor="middle">appointment-core · AppointmentStateMachine.kt · github.com/bluetape4k/clinic-appointment</text>
