<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
<style>
.title{font-family:'Architects Daughter','Comic Sans MS','Comic Neue',cursive;font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#6b7280;font-weight:400}
.label{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400}
.value{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400;font-size:18px}
.axis{font-size:16px}.legend{font-size:18px}.note{font-size:17px}.label{font-size:18px}
</style>
<rect width="1280" height="500" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="452" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Solver Benchmark Summary</text><text class="subtitle" x="58" y="104" font-size="18">Execution time vs move evaluation speed</text><text class="axis" x="260" y="124">Execution time (ms)</text><text class="axis" x="820" y="124">Move speed (/sec)</text><text class="label" x="56" y="173">Small</text><rect x="260" y="145" width="68.86309523809524" height="18" rx="7" fill="#8ecae6"/><text class="value" x="336.86309523809524" y="160" font-size="15">5,030</text><rect x="260" y="169" width="136.90476190476193" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="404.9047619047619" y="184" font-size="15">10,000</text><rect x="820" y="145" width="258.92857142857133" height="18" rx="7" fill="#b8e0d2"/><text class="value" x="1086.9285714285713" y="160" font-size="15">133,758</text><text class="label" x="56" y="243">Medium</text><rect x="260" y="215" width="113.22023809523807" height="18" rx="7" fill="#8ecae6"/><text class="value" x="381.2202380952381" y="230" font-size="15">8,270</text><rect x="260" y="239" width="205.3571428571429" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="473.3571428571429" y="254" font-size="15">15,000</text><rect x="820" y="215" width="194.7665213082048" height="18" rx="7" fill="#b8e0d2"/><text class="value" x="1022.7665213082048" y="230" font-size="15">100,613</text><text class="label" x="56" y="313">Large</text><rect x="260" y="285" width="221.2791666666667" height="18" rx="7" fill="#8ecae6"/><text class="value" x="489.2791666666667" y="300" font-size="15">16,163</text><rect x="260" y="309" width="410.7142857142858" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="678.7142857142858" y="324" font-size="15">30,000</text><rect x="820" y="285" width="224.8139897640301" height="18" rx="7" fill="#b8e0d2"/><text class="value" x="1052.81398976403" y="300" font-size="15">116,135</text><text class="note" x="56" y="460">Lower execution time is better; higher move speed is better.</text></svg>
