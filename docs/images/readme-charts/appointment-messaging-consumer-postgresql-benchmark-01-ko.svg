<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="PostgreSQL 예약 consumer throughput과 lock contention benchmark">
  <title>PostgreSQL 예약 consumer benchmark</title>
