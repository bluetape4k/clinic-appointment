x="1282.45" y="1197" text-anchor="middle" class="badgeText">12</text><text x="1308.45" y="1197" class="msg returnText">AppointmentRecord</text></g><path d="M 1530 1227 L 1214 1227" class="return returnLine"/><g><rect x="1266.75" y="1257" width="196.5" height="34" rx="17" class="label eventLabel"/><circle cx="1290.75" cy="1274" r="13" class="badge eventBadge"/><text x="1290.75" y="1279" text-anchor="middle" class="badgeText">13</text><text x="1316.75" y="1279" class="msg eventText">publish Created</text></g><path d="M 870 1309 L 1846 1309" class="event"/><g><rect x="1885.25" y="1339" width="279.5" height="34" rx="17" class="label eventLabel"/><circle cx="1909.25" cy="1356" r="13" class="badge eventBadge"/><text x="1909.25" y="1361" text-anchor="middle" class="badgeText">14</text><text x="1935.25" y="1361" class="msg eventText">NotificationEventListener</text></g><path d="M 1860 1391 L 2176 1391" class="event"/><g><rect x="1711.95" y="1421" width="296.1" height="34" rx="17" class="label workLabel"/><circle cx="1735.95" cy="1438" r="13" class="badge workBadge"/><text x="1735.95" y="1443" text-anchor="middle" class="badgeText">15</text><text x="1761.95" y="1443" class="msg workText">INSERT notification_history</text></g><path d="M 2190 1473 L 1544 1473" class="work"/><g><rect x="573.55" y="1503" width="262.9" height="34" rx="17" class="label returnLabel"/><circle cx="597.55" cy="1520" r="13" class="badge returnBadge"/><text x="597.55" y="1525" text-anchor="middle" class="badgeText">16</text><text x="623.55" y="1525" class="msg returnText">201 AppointmentResponse</text></g><path d="M 870 1555 L 554 1555" class="return returnLine"/><g><rect x="256" y="1585" width="238" height="34" rx="17" class="label returnLabel"/><circle cx="280" cy="1602" r="13" class="badge returnBadge"/><text x="280" y="1607" text-anchor="middle" class="badgeText">17</text><text x="306" y="1607" class="msg returnText">booking confirmation</text></g><path d="M 540 1637 L 224 1637" class="return returnLine"/><rect x="440" y="1801" width="1520" height="44" rx="12" class="noteBox"/><text class="note" x="1200" y="1829" text-anchor="middle">Sequence baseline: rectangular headers, dashed lifelines, numbered message pills, visible arrowheads, and branch frames only where behavior exists.</text>
