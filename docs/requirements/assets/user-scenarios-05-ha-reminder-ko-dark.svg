      <path class="message" d="M804 610 H1404" marker-end="url(#sequence-arrow)"/>
    </g>
<g id="message-7">
      <rect class="label" x="987.75" y="640" width="240.5" height="24" rx="6"/>
      <circle class="step" cx="1002.75" cy="652" r="11"/>
