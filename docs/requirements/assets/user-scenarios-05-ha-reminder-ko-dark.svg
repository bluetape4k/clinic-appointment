      <path class="message" d="M784 378 H496" marker-end="url(#sequence-arrow)"/>
    </g>
<g id="message-3">
      <rect class="label" x="561" y="408" width="150" height="24" rx="6"/>
      <circle class="step" cx="576" cy="420" r="11"/>
