  <g id="missed-reminder-note"><rect class="note" x="250" y="990" width="1400" height="48" rx="12"/><text class="note-text" x="950" y="1021" text-anchor="middle">보정 시간창 경과: SUPPRESSED(REMINDER_WINDOW_MISSED), 늦은 발송 금지</text></g>
  </svg>