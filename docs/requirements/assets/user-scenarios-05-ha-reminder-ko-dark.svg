      <path class="message" d="M804 726 H1716" marker-end="url(#sequence-arrow)"/>
    </g>
<g id="message-9">
      <rect class="label" x="1189" y="756" width="150" height="24" rx="6"/>
      <circle class="step" cx="1204" cy="768" r="11"/>
      <text class="badgeText" x="1204" y="772" text-anchor="middle">9</text>
