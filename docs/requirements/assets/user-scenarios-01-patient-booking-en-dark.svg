<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1320" viewBox="0 0 2100 1320" role="img" aria-labelledby="sequence-title sequence-description">
  <title id="sequence-title">Patient appointment creation sequence</title><desc id="sequence-description">Availability is read first; appointment and notification intent commit together</desc>
  <defs>
    <filter id="sequence-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/></filter>
    <marker id="sequence-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#edf4ff"/></marker>
    <style>
      svg{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.canvas{fill:#0f1724}.frame{fill:#172234;stroke:#40526a;stroke-width:3}
      .title{font-size:38px;font-weight:750;fill:#edf4ff}.subtitle{font-size:17px;fill:#b6c4d7}
      .header{fill:#223148;stroke:#7da6ff;stroke-width:2.4;filter:url(#sequence-shadow)}
      .participant-title{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;font-weight:700;fill:#edf4ff}
      .lifeline{stroke:#49617d;stroke-width:2;stroke-dasharray:8 8}.message{stroke:#b09aff;stroke-width:2.8;fill:none}
      .activation{fill:#263852;stroke:#b09aff;stroke-width:1.5}.label{fill:#172234;stroke:#40526a;stroke-width:1}.msg{font-size:12px;fill:#b6c4d7}
      .step{fill:#b09aff}.badgeText{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;font-weight:700;fill:#172234}
      .note{fill:#382f1c;stroke:#d6ad59;stroke-width:2}.note-text{font-size:15px;font-weight:650;fill:#edf4ff}
    </style>
  </defs>
  <rect class="canvas" width="2100" height="1320"/><rect class="frame" x="36" y="32" width="1828" height="1052" rx="32"/>
  <text class="title" x="950" y="88" text-anchor="middle">Patient appointment creation sequence</text>
  <text class="subtitle" x="950" y="122" text-anchor="middle">Availability is read first; appointment and notification intent commit together</text>
  <g id="rollout-note"><rect class="note" x="250" y="145" width="1400" height="42" rx="12"/><text class="note-text" x="950" y="172" text-anchor="middle">The event bridge never creates a second notification; it claims the already committed outbox row.</text></g>
