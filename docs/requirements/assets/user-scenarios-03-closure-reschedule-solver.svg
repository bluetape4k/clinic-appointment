th="296.1" height="34" rx="17" class="label asyncLabel"/><circle cx="1075.95" cy="782" r="13" class="badge asyncBadge"/><text x="1075.95" y="787" text-anchor="middle" class="badgeText">7</text><text x="1101.95" y="787" class="msg asyncText">solve(clinicId, ids, range)</text></g><path d="M 870 817 L 1516 817" class="async"/><g><rect x="1526.2" y="847" width="337.6" height="34" rx="17" class="label workLabel"/><circle cx="1550.2" cy="864" r="13" class="badge workBadge"/><text x="1550.2" y="869" text-anchor="middle" class="badgeText">8</text><text x="1576.2" y="869" class="msg workText">load facts and planning entities</text></g><path d="M 1530 899 L 1846 899" class="work"/><g><rect x="1563.45" y="929" width="213.10000000000002" height="34" rx="17" class="label asyncLabel"/><circle cx="1587.45" cy="946" r="13" class="badge asyncBadge"/><text x="1587.45" y="951" text-anchor="middle" class="badgeText">9</text><text x="1613.45" y="951" class="msg asyncText">Timefold optimize</text></g><path d="M 1530 981 L 1652 981 Q 1668 981 1668 997 L 1668 1019 Q 1668 1035 1652 1035 L 1548 1035" class="async"/><g><rect x="1064.4" y="1011" width="271.20000000000005" height="34" rx="17" class="label returnLabel"/><circle cx="1088.4" cy="1028" r="13" class="badge returnBadge"/><text x="1088.4" y="1033" text-anchor="middle" class="badgeText">10</text><text x="1114.4" y="1033" class="msg returnText">SolverResult assignments</text></g><path d="M 1530 1063 L 884 1063" class="return returnLine"/><g><rect x="899.4" y="1093" width="271.20000000000005" height="34" rx="17" class="label workLabel"/><circle cx="923.4" cy="1110" r="13" class="badge workBadge"/><text x="923.4" y="1115" text-anchor="middle" class="badgeText">11</text><text x="949.4" y="1115" class="msg workText">save new + mark original</text></g><path d="M 870 1145 L 1186 1145" class="work"/><g><rect x="1431.75" y="1175" width="196.5" height="34" rx="17" class="label workLabel"/><circle cx="1455.75" cy="1192" r="13" class="badge workBadge"/><text x="1455.75" y="1197" text-anchor="middle" class="badgeText">12</text><text x="1481.75" y="1197" class="msg workText">INSERT / UPDATE</text></g><path d="M 1200 1227 L 1846 1227" class="work"/><g><rect x="1415.15" y="1257" width="229.70000000000002" height="34" rx="17" class="label eventLabel"/><circle cx="1439.15" cy="1274" r="13" class="badge eventBadge"/><text x="1439.15" y="1279" text-anchor="middle" class="badgeText">13</text><text x="1465.15" y="1279" class="msg eventText">publish Rescheduled</text></g><path d="M 870 1309 L 2176 1309" class="event"/><g><rect x="610" y="1339" width="190" height="34" rx="17" class="label returnLabel"/><circle cx="634" cy="1356" r="13" class="badge returnBadge"/><text x="634" y="1361" text-anchor="middle" class="badgeText">14</text><text x="660" y="1361" class="msg returnText">summary</text></g><path d="M 870 1391 L 554 1391" class="return returnLine"/><rect x="440" y="1555" width="1520" height="44" rx="12" class="noteBox"/><text class="note" x="1200" y="1583" text-anchor="middle">Sequence baseline: rectangular headers, dashed lifelines, numbered message pills, visible arrowheads, and branch frames only where behavior exists.</text>
