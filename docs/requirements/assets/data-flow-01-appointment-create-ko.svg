<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="appointment-title appointment-description">
  <title id="appointment-title">예약 생성과 알림 의도 기록</title><desc id="appointment-description">예약과 최소 outbox 행을 원자적으로 커밋하고 실제 발송은 비동기로 이어간다</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#27415f" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L13 6.5 L0 13 Z" fill="#20324a"/></marker>
    <style>svg{font-family:"goorm Sans","Noto Sans KR",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#f4f7fb}.frame{fill:#ffffff;stroke:#cbd7e6;stroke-width:3}.title{font-size:38px;font-weight:750;fill:#20324a}.subtitle{font-size:17px;fill:#56677d}.card{stroke-width:2.5;filter:url(#shadow)}.card-title{font-family:"goorm Sans Code","Noto Sans Mono",ui-monospace,monospace;font-size:17px;font-weight:700;fill:#20324a}.detail{font-size:13px;fill:#56677d}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.edge-label-bg{fill:#ffffff;stroke:#cbd7e6;stroke-width:1}.edge-label{font-family:"goorm Sans Code","Noto Sans Mono",ui-monospace,monospace;font-size:12px;fill:#56677d}.note{fill:#fff9e8;stroke:#d4aa53;stroke-width:2}.note-text{font-size:17px;font-weight:650;fill:#20324a}</style>
  </defs><rect class="canvas" width="1800" height="900"/><rect class="frame" x="38" y="34" width="1724" height="832" rx="32"/>
  <text class="title" x="900" y="100" text-anchor="middle">예약 생성과 알림 의도 기록</text><text class="subtitle" x="900" y="136" text-anchor="middle">예약과 최소 outbox 행을 원자적으로 커밋하고 실제 발송은 비동기로 이어간다</text>
  <g id="appointment-flow-card-0">
    <rect class="card" x="95" y="280" width="250" height="145" rx="18" fill="#ffffff" stroke="#4f77c9"/>
    <rect x="95" y="280" width="8" height="145" rx="4" fill="#4f77c9"/>
    <text class="card-title" x="119" y="315">환자와 Frontend</text>
    <text class="detail" x="119" y="346">가용 슬롯 선택</text>
<text class="detail" x="119" y="370">POST /api/appointments</text>
  </g>
<g id="appointment-flow-card-1">
    <rect class="card" x="390" y="280" width="250" height="145" rx="18" fill="#ffffff" stroke="#8067cf"/>
    <rect x="390" y="280" width="8" height="145" rx="4" fill="#8067cf"/>
    <text class="card-title" x="414" y="315">예약 API</text>
    <text class="detail" x="414" y="346">JWT와 슬롯 검증</text>
<text class="detail" x="414" y="370">하나의 transaction 시작</text>
  </g>
<g id="appointment-flow-card-2">
    <rect class="card" x="685" y="280" width="250" height="145" rx="18" fill="#ffffff" stroke="#2f9f93"/>
    <rect x="685" y="280" width="8" height="145" rx="4" fill="#2f9f93"/>
    <text class="card-title" x="709" y="315">예약 + outbox DB</text>
    <text class="detail" x="709" y="346">예약 행</text>
<text class="detail" x="709" y="370">최소 알림 의도</text>
  </g>
<g id="appointment-flow-card-3">
    <rect class="card" x="980" y="280" width="250" height="145" rx="18" fill="#ffffff" stroke="#cc8428"/>
    <rect x="980" y="280" width="8" height="145" rx="4" fill="#cc8428"/>
    <text class="card-title" x="1004" y="315">도메인 이벤트</text>
    <text class="detail" x="1004" y="346">커밋 후에만 발행</text>
<text class="detail" x="1004" y="370">로그와 전환기 신호</text>
  </g>
<g id="appointment-flow-card-4">
    <rect class="card" x="1275" y="280" width="250" height="145" rx="18" fill="#ffffff" stroke="#4f77c9"/>
    <rect x="1275" y="280" width="8" height="145" rx="4" fill="#4f77c9"/>
    <text class="card-title" x="1299" y="315">선택된 알림 경로</text>
    <text class="detail" x="1299" y="346">event bridge 또는 worker</text>
<text class="detail" x="1299" y="370">정확한 행을 조건부 선점</text>
  </g>
<g id="appointment-flow-card-5">
    <rect class="card" x="1275" y="570" width="250" height="145" rx="18" fill="#ffffff" stroke="#2f9f93"/>
    <rect x="1275" y="570" width="8" height="145" rx="4" fill="#2f9f93"/>
    <text class="card-title" x="1299" y="605">개인정보 안전 발송</text>
    <text class="detail" x="1299" y="636">최신 회원 프로필 조회</text>
<text class="detail" x="1299" y="660">메모리에서 렌더링·발송</text>
  </g><g id="appointment-flow-edge-0"><path class="edge" d="M345 352 H390" stroke="#4f77c9" marker-end="url(#arrow)"/></g>
<g id="appointment-flow-edge-1"><path class="edge" d="M640 352 H685" stroke="#8067cf" marker-end="url(#arrow)"/></g>
<g id="appointment-flow-edge-2"><path class="edge" d="M935 352 H980" stroke="#2f9f93" marker-end="url(#arrow)"/></g>
<g id="appointment-flow-edge-3"><path class="edge" d="M1230 352 H1275" stroke="#cc8428" marker-end="url(#arrow)"/></g>
<g id="appointment-flow-edge-4"><path class="edge" d="M1400 425 V570" stroke="#4f77c9" marker-end="url(#arrow)"/></g><g><rect class="note" x="240" y="750" width="1320" height="58" rx="16"/><text class="note-text" x="900" y="786" text-anchor="middle">outbox에는 수신자·전화번호·완성 본문·provider 원문 오류를 저장하지 않는다.</text></g></svg>