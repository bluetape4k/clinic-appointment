ge asyncBadge"/><text x="1464" y="869" text-anchor="middle" class="badgeText">8</text><text x="1490" y="869" class="msg asyncText">RRULE 확장</text></g><path d="M 1395 899 L 1517 899 Q 1533 899 1533 915 L 1533 937 Q 1533 953 1517 953 L 1413 953" class="async"/><g><rect x="1461.05" y="929" width="262.9" height="34" rx="17" class="label workLabel"/><circle cx="1485.05" cy="946" r="13" class="badge workBadge"/><text x="1485.05" y="951" text-anchor="middle" class="badgeText">9</text><text x="1511.05" y="951" class="msg workText">확장된 시간대 INSERT</text></g><path d="M 1395 981 L 1776 981" class="work"/><g><rect x="707.5" y="1011" width="190" height="34" rx="17" class="label returnLabel"/><circle cx="731.5" cy="1028" r="13" class="badge returnBadge"/><text x="731.5" y="1033" text-anchor="middle" class="badgeText">10</text><text x="757.5" y="1033" class="msg returnText">201 Created</text></g><path d="M 1000 1063 L 619 1063" class="return returnLine"/><rect x="240" y="1227" width="1520" height="44" rx="12" class="noteBox"/><text class="note" x="1000" y="1255" text-anchor="middle">시퀀스 기준: 사각형 헤더, 점선 lifeline, 번호가 있는 메시지 pill, 보이는 화살표, 실제 분기만 표시하는 프레임.</text>
