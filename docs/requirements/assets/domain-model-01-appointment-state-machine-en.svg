<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" role="img" aria-label="Appointment State Machine">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#27415f" flood-opacity="0.12"/></filter>
  <marker id="arrow-blue" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4f77c9" stroke="#4f77c9"/></marker>
<marker id="arrow-cyan" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4aa6b5" stroke="#4aa6b5"/></marker>
<marker id="arrow-teal" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#2f9f93" stroke="#2f9f93"/></marker>
<marker id="arrow-green" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#3c987e" stroke="#3c987e"/></marker>
<marker id="arrow-amber" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d28a28" stroke="#d28a28"/></marker>
<marker id="arrow-orange" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d9823b" stroke="#d9823b"/></marker>
<marker id="arrow-pink" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d85f8d" stroke="#d85f8d"/></marker>
<marker id="arrow-purple" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#8a65d8" stroke="#8a65d8"/></marker>
<marker id="arrow-red" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#ca5f66" stroke="#ca5f66"/></marker>
<marker id="arrow-slate" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#718096" stroke="#718096"/></marker>
  <style>
    svg{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#f6f9fc}.frame{fill:#ffffff;stroke:#c4d5e8;stroke-width:3;filter:url(#shadow)}
    .title,.panel-title,.card-title,.state-title{font-family:"Architects Daughter","Comic Sans MS",cursive;fill:#263a57}
    .title{font-size:46px}.subtitle{font-size:17px;fill:#526276}.panel-title{font-size:27px}.card-title{font-size:24px}.state-title{font-size:22px}
    .detail,.small,.pill-text,.route-label,.footer{font-family:"Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif;fill:#526276}
    .detail{font-size:14px}.small{font-size:12px}.pill-text{font-size:13px}.route-label{font-size:13px}.footer{font-size:14px}
    .panel{stroke-width:2}.card{stroke-width:2.4;filter:url(#shadow)}.pill{stroke-width:1.8}.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#b7c8dc;stroke-width:2;stroke-dasharray:8 8}.message{fill:none;stroke-width:3;stroke-linecap:round}.note{fill:#fffdf7;stroke:#d7b970;stroke-width:2}
    .table{stroke-width:2.2;filter:url(#shadow)}.table-head{font-family:"Architects Daughter";font-size:21px;fill:#263a57}.row{font-size:12.5px;fill:#526276}
  </style>
</defs>
<rect class="canvas" width="2000" height="1300"/>
<rect class="frame" x="48" y="42" width="1904" height="1216" rx="34"/>
<text class="title" x="1000" y="104" text-anchor="middle">Appointment State Machine</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">Top-to-bottom progression with separate lanes for cancellation, no-show, and reschedule recovery.</text>
<text class="section" x="430" y="206" text-anchor="middle">main progression</text>
<text class="section" x="1020" y="206" text-anchor="middle">terminal exceptions</text>
<text class="section" x="1540" y="206" text-anchor="middle">reschedule recovery</text>
<g id="pending"><rect class="card" x="300" y="245" width="260" height="96" rx="16" fill="#fff" stroke="#718096"/><g transform="translate(318 263)"><rect width="44" height="44" rx="10" fill="#718096"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="285">PENDING</text><text class="detail" x="324" y="319" text-anchor="start"><tspan x="324" dy="0">draft or pre-booking</tspan></text></g>
<g id="requested"><rect class="card" x="300" y="395" width="260" height="96" rx="16" fill="#fff" stroke="#4f77c9"/><g transform="translate(318 413)"><rect width="44" height="44" rx="10" fill="#4f77c9"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="435">REQUESTED</text><text class="detail" x="324" y="469" text-anchor="start"><tspan x="324" dy="0">patient-facing request</tspan></text></g>
<g id="confirmed"><rect class="card" x="300" y="545" width="260" height="96" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(318 563)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="585">CONFIRMED</text><text class="detail" x="324" y="619" text-anchor="start"><tspan x="324" dy="0">pinned for Solver</tspan></text></g>
<g id="checked"><rect class="card" x="300" y="695" width="260" height="96" rx="16" fill="#fff" stroke="#4aa6b5"/><g transform="translate(318 713)"><rect width="44" height="44" rx="10" fill="#4aa6b5"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="735">CHECKED_IN</text><text class="detail" x="324" y="769" text-anchor="start"><tspan x="324" dy="0">patient arrived</tspan></text></g>
<g id="progress"><rect class="card" x="300" y="845" width="260" height="96" rx="16" fill="#fff" stroke="#8a65d8"/><g transform="translate(318 863)"><rect width="44" height="44" rx="10" fill="#8a65d8"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="885">IN_PROGRESS</text><text class="detail" x="324" y="919" text-anchor="start"><tspan x="324" dy="0">treatment active</tspan></text></g>
<g id="completed"><rect class="card" x="300" y="995" width="260" height="96" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(318 1013)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="376" y="1035">COMPLETED</text><text class="detail" x="324" y="1069" text-anchor="start"><tspan x="324" dy="0">terminal success</tspan></text></g>
<g id="cancelled"><rect class="card" x="870" y="455" width="300" height="96" rx="16" fill="#fff" stroke="#ca5f66"/><g transform="translate(888 473)"><rect width="44" height="44" rx="10" fill="#ca5f66"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="946" y="495">CANCELLED</text><text class="detail" x="894" y="529" text-anchor="start"><tspan x="894" dy="0">terminal cancellation</tspan></text></g>
<g id="noshow"><rect class="card" x="870" y="745" width="300" height="96" rx="16" fill="#fff" stroke="#8a65d8"/><g transform="translate(888 763)"><rect width="44" height="44" rx="10" fill="#8a65d8"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="946" y="785">NO_SHOW</text><text class="detail" x="894" y="819" text-anchor="start"><tspan x="894" dy="0">terminal missed visit</tspan></text></g>
<g id="resched"><rect class="card" x="1375" y="325" width="340" height="96" rx="16" fill="#fff" stroke="#d28a28"/><g transform="translate(1393 343)"><rect width="44" height="44" rx="10" fill="#d28a28"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="1451" y="365">PENDING_RESCHEDULE</text><text class="detail" x="1399" y="399" text-anchor="start"><tspan x="1399" dy="0">closure or reassignment</tspan></text></g>
<g id="done"><rect class="card" x="1415" y="595" width="260" height="96" rx="16" fill="#fff" stroke="#d28a28"/><g transform="translate(1433 613)"><rect width="44" height="44" rx="10" fill="#d28a28"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h12l6 8-6 8H16l-6-8z"/><path d="M17 22h10"/></g></g><text class="card-title" x="1491" y="635">RESCHEDULED</text><text class="detail" x="1439" y="669" text-anchor="start"><tspan x="1439" dy="0">terminal reassigned</tspan></text></g>
