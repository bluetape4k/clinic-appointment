<text x="1100" y="78" text-anchor="middle" class="title">Appointment Status Lifecycle Sequence</text>
<text x="1100" y="108" text-anchor="middle" class="subtitle">Staff-driven status transitions, persistence, and status change events.</text>
<rect x="92" y="640" width="2016" height="430" rx="14" class="branchOk"/><text x="122" y="670" class="note">repeat for CheckIn, StartTreatment, Complete</text><rect x="98" y="150" width="224" height="74" rx="10" class="header" fill="#eaf4f8" stroke="#3f7d9c"/><text class="participant" x="210" y="195" text-anchor="middle">Staff</text><line x1="210" y1="224" x2="210" y2="1521" class="lifeline"/><rect x="454" y="150" width="224" height="74" rx="10" class="header" fill="#eef7f0" stroke="#6e8f4f"/><text class="participant" x="566" y="195" text-anchor="middle">Frontend</text><line x1="566" y1="224" x2="566" y2="1521" class="lifeline"/><rect x="810" y="150" width="224" height="74" rx="10" class="header" fill="#fff7e8" stroke="#9b7d54"/><text class="participant" x="922" y="195" text-anchor="middle">API</text><line x1="922" y1="224" x2="922" y2="1521" class="lifeline"/><rect x="1166" y="150" width="224" height="74" rx="10" class="header" fill="#fff0f0" stroke="#b86868"/><text class="participant" x="1278" y="195" text-anchor="middle">StateMachine</text><line x1="1278" y1="224" x2="1278" y2="1521" class="lifeline"/><rect x="1522" y="150" width="224" height="74" rx="10" class="header" fill="#f4efff" stroke="#8a65d8"/><text class="participant" x="1634" y="195" text-anchor="middle">PostgreSQL</text><line x1="1634" y1="224" x2="1634" y2="1521" class="lifeline"/><rect x="1878" y="150" width="224" height="74" rx="10" class="header" fill="#eef7f0" stroke="#2f9f93"/><text class="participant" x="1990" y="195" text-anchor="middle">EventBus</text><line x1="1990" y1="224" x2="1990" y2="1521" class="lifeline"/><g><rect x="264.85" y="273" width="246.3" height="34" rx="17" class="label callLabel"/><circle cx="288.85" cy="290" r="13" class="badge callBadge"/><text x="288.85" y="295" text-anchor="middle" class="badgeText">1</text><text x="314.85" y="295" class="msg callText">Open appointment list</text></g><path d="M 210 325 L 552 325" class="call"/><g><rect x="620.85" y="355" width="246.3" height="34" rx="17" class="label callLabel"/><circle cx="644.85" cy="372" r="13" class="badge callBadge"/><text x="644.85" y="377" text-anchor="middle" class="badgeText">2</text><text x="670.85" y="377" class="msg callText">GET /api/appointments</text></g><path d="M 566 407 L 908 407" class="call"/><g><rect x="1159" y="437" width="238" height="34" rx="17" class="label workLabel"/><circle cx="1183" cy="454" r="13" class="badge workBadge"/><text x="1183" y="459" text-anchor="middle" class="badgeText">3</text><text x="1209" y="459" class="msg workText">SELECT by date range</text></g><path d="M 922 489 L 1620 489" class="work"/><g><rect x="1138.25" y="519" width="279.5" height="34" rx="17" class="label returnLabel"/><circle cx="1162.25" cy="536" r="13" class="badge returnBadge"/><text x="1162.25" y="541" text-anchor="middle" class="badgeText">4</text><text x="1188.25" y="541" class="msg returnText">List&lt;AppointmentResponse&gt;</text></g><path d="M 1634 571 L 936 571" class="return returnLine"/><g><rect x="293" y="601" width="190" height="34" rx="17" class="label callLabel"/><circle cx="317" cy="618" r="13" class="badge callBadge"/><text x="317" y="623" text-anchor="middle" class="badgeText">5</text><text x="343" y="623" class="msg callText">Confirm</text></g><path d="M 210 653 L 552 653" class="call"/><g><rect x="625" y="683" width="238" height="34" rx="17" class="label callLabel"/><circle cx="649" cy="700" r="13" class="badge callBadge"/><text x="649" y="705" text-anchor="middle" class="badgeText">6</text><text x="675" y="705" class="msg callText">PATCH status Confirm</text></g><path d="M 566 735 L 908 735" class="call"/><g><rect x="972.7" y="765" width="254.60000000000002" height="34" rx="17" class="label eventLabel"/><circle cx="996.7" cy="782" r="13" class="badge eventBadge"/><text x="996.7" y="787" text-anchor="middle" class="badgeText">7</text><text x="1022.7" y="787" class="msg eventText">REQUESTED -&gt; CONFIRMED</text></g><path d="M 922 817 L 1264 817" class="event"/><g><rect x="1183" y="847" width="190" height="34" rx="17" class="label workLabel"/><circle cx="1207" cy="864" r="13" class="badge workBadge"/><text x="1207" y="869" text-anchor="middle" class="badgeText">8</text><text x="1233" y="869" class="msg workText">UPDATE status</text></g><path d="M 922 899 L 1620 899" class="work"/><g><rect x="1332.85" y="929" width="246.3" height="34" rx="17" class="label eventLabel"/><circle cx="1356.85" cy="946" r="13" class="badge eventBadge"/><text x="1356.85" y="951" text-anchor="middle" class="badgeText">9</text><text x="1382.85" y="951" class="msg eventText">publish StatusChanged</text></g><path d="M 922 981 L 1976 981" class="event"/><g><rect x="239.95" y="1011" width="296.1" height="34" rx="17" class="label callLabel"/><circle cx="263.95" cy="1028" r="13" class="badge callBadge"/><text x="263.95" y="1033" text-anchor="middle" class="badgeText">10</text><text x="289.95" y="1033" class="msg callText">Check in / start / complete</text></g><path d="M 210 1063 L 552 1063" class="call"/><g><rect x="629.15" y="1093" width="229.70000000000002" height="34" rx="17" class="label callLabel"/><circle cx="653.15" cy="1110" r="13" class="badge callBadge"/><text x="653.15" y="1115" text-anchor="middle" class="badgeText">11</text><text x="679.15" y="1115" class="msg callText">PATCH status events</text></g><path d="M 566 1145 L 908 1145" class="call"/><g><rect x="964.4" y="1175" width="271.20000000000005" height="34" rx="17" class="label eventLabel"/><circle cx="988.4" cy="1192" r="13" class="badge eventBadge"/><text x="988.4" y="1197" text-anchor="middle" class="badgeText">12</text><text x="1014.4" y="1197" class="msg eventText">validate next transition</text></g><path d="M 922 1227 L 1264 1227" class="event"/><g><rect x="1167.3" y="1257" width="221.4" height="34" rx="17" class="label workLabel"/><circle cx="1191.3" cy="1274" r="13" class="badge workBadge"/><text x="1191.3" y="1279" text-anchor="middle" class="badgeText">13</text><text x="1217.3" y="1279" class="msg workText">UPDATE final state</text></g><path d="M 922 1309 L 1620 1309" class="work"/><g><rect x="1332.85" y="1339" width="246.3" height="34" rx="17" class="label eventLabel"/><circle cx="1356.85" cy="1356" r="13" class="badge eventBadge"/><text x="1356.85" y="1361" text-anchor="middle" class="badgeText">14</text><text x="1382.85" y="1361" class="msg eventText">publish StatusChanged</text></g><path d="M 922 1391 L 1976 1391" class="event"/><rect x="340" y="1555" width="1520" height="44" rx="12" class="noteBox"/><text class="note" x="1100" y="1583" text-anchor="middle">Sequence baseline: rectangular headers, dashed lifelines, numbered message pills, visible arrowheads, and branch frames only where behavior exists.</text>
