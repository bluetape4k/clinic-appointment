<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1580" viewBox="0 0 2000 1580" role="img" aria-label="임시휴진 재배정 프로세스 흐름">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#27415f" flood-opacity="0.12"/></filter>
  <marker id="arrow-blue" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4f77c9" stroke="#4f77c9"/></marker>
<marker id="arrow-cyan" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#4aa6b5" stroke="#4aa6b5"/></marker>
<marker id="arrow-teal" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#2f9f93" stroke="#2f9f93"/></marker>
<marker id="arrow-green" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#3c987e" stroke="#3c987e"/></marker>
<marker id="arrow-amber" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d28a28" stroke="#d28a28"/></marker>
<marker id="arrow-orange" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d9823b" stroke="#d9823b"/></marker>
<marker id="arrow-pink" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#d85f8d" stroke="#d85f8d"/></marker>
<marker id="arrow-purple" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#8a65d8" stroke="#8a65d8"/></marker>
<marker id="arrow-red" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#ca5f66" stroke="#ca5f66"/></marker>
<marker id="arrow-slate" markerWidth="15" markerHeight="15" refX="13.5" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#718096" stroke="#718096"/></marker>
  <style>
    svg{font-family:"goorm Sans","goorm Sans Code",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#f6f9fc}.frame{fill:#ffffff;stroke:#c4d5e8;stroke-width:3;filter:url(#shadow)}
    .title,.panel-title{font-family:"goorm Sans",ui-sans-serif,system-ui,sans-serif;fill:#263a57}.card-title{font-family:"goorm Sans Code","goorm Sans",ui-sans-serif,system-ui,sans-serif;fill:#263a57}
    .title{font-size:36px}.subtitle{font-size:15px;fill:#526276}.panel-title{font-size:22px}.card-title{font-size:19px}
    .detail,.small,.route-label,.footer{font-family:"goorm Sans Code","goorm Sans",ui-sans-serif,system-ui,sans-serif;fill:#526276}
    .detail{font-size:13px}.small{font-size:11px}.route-label{font-size:12px}.footer{font-size:13px}
    .panel{stroke-width:2}.card{stroke-width:2.4;filter:url(#shadow)}.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#b7c8dc;stroke-width:2;stroke-dasharray:8 8}.message{fill:none;stroke-width:3;stroke-linecap:round}
    .alt{fill:#fff8ea;stroke:#d7b970;stroke-width:2}.loop{fill:#effaf6;stroke:#8ac7b6;stroke-width:2}
  </style>
</defs>
<rect class="canvas" width="2000" height="1580"/>
<rect class="frame" x="48" y="42" width="1904" height="1496" rx="34"/>
<text class="title" x="1000" y="104" text-anchor="middle">임시휴진 재배정 프로세스 흐름</text>
<text class="subtitle" x="1000" y="138" text-anchor="middle">Solver와 greedy placement branch를 분리한 위에서 아래로 흐르는 프로세스.</text>
<g id="admin"><rect class="card" x="820" y="215" width="360" height="120" rx="16" fill="#fff" stroke="#ca5f66"/><g transform="translate(838 233)"><rect width="44" height="44" rx="10" fill="#ca5f66"/><g fill="none" stroke="#fff" stroke-width="2.2"><circle cx="22" cy="15" r="6"/><path d="M10 36c2-9 22-9 24 0"/></g></g><text class="card-title" x="896" y="255">Admin</text><text class="detail" x="844" y="290" text-anchor="start"><tspan x="844" dy="0">POST closureDate</tspan></text></g>
<g id="api"><rect class="card" x="820" y="400" width="360" height="120" rx="16" fill="#fff" stroke="#4f77c9"/><g transform="translate(838 418)"><rect width="44" height="44" rx="10" fill="#4f77c9"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="896" y="440">RescheduleController</text><text class="detail" x="844" y="475" text-anchor="start"><tspan x="844" dy="0">closure reschedule workflow 시작</tspan></text></g>
<g id="affected"><rect class="card" x="820" y="585" width="360" height="125" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(838 603)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="896" y="625">Affected Appointments</text><text class="detail" x="844" y="660" text-anchor="start"><tspan x="844" dy="0">closure date의 REQUESTED / CONFIRMED</tspan></text></g>
<g id="pending"><rect class="card" x="820" y="775" width="360" height="125" rx="16" fill="#fff" stroke="#d28a28"/><g transform="translate(838 793)"><rect width="44" height="44" rx="10" fill="#d28a28"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="896" y="815">PENDING_RESCHEDULE</text><text class="detail" x="844" y="850" text-anchor="start"><tspan x="844" dy="0">placement 전에 원본 예약을</tspan><tspan x="844" dy="19">표시</tspan></text></g>
<g id="solver"><rect class="card" x="360" y="1000" width="380" height="135" rx="16" fill="#fff" stroke="#8a65d8"/><g transform="translate(378 1018)"><rect width="44" height="44" rx="10" fill="#8a65d8"/><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M16 28c-4-2-5-9 1-12 2-7 13-5 13 3 5 2 4 11-2 12"/><path d="M19 18v12M25 17v14"/></g></g><text class="card-title" x="436" y="1040">Timefold Solver</text><text class="detail" x="384" y="1075" text-anchor="start"><tspan x="384" dy="0">hard/soft constraints로</tspan><tspan x="384" dy="19">batch optimization</tspan></text></g>
<g id="greedy"><rect class="card" x="1260" y="1000" width="380" height="135" rx="16" fill="#fff" stroke="#2f9f93"/><g transform="translate(1278 1018)"><rect width="44" height="44" rx="10" fill="#2f9f93"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15h18v14H13z"/><path d="M17 22h10M17 28h6"/></g></g><text class="card-title" x="1336" y="1040">Greedy Fallback</text><text class="detail" x="1284" y="1075" text-anchor="start"><tspan x="1284" dy="0">SlotCalculationService로</tspan><tspan x="1284" dy="19">single placement</tspan></text></g>
<g id="save"><rect class="card" x="820" y="1240" width="360" height="125" rx="16" fill="#fff" stroke="#3c987e"/><g transform="translate(838 1258)"><rect width="44" height="44" rx="10" fill="#3c987e"/><g fill="none" stroke="#fff" stroke-width="2.3"><ellipse cx="22" cy="13" rx="12" ry="5"/><path d="M10 13v18c0 3 5 5 12 5s12-2 12-5V13"/><path d="M10 22c0 3 5 5 12 5s12-2 12-5"/></g></g><text class="card-title" x="896" y="1280">Persist Result</text><text class="detail" x="844" y="1315" text-anchor="start"><tspan x="844" dy="0">new appointment + original RESCHEDULED</tspan><tspan x="844" dy="19">+ event</tspan></text></g>
<path class="route" d="M1000 335 L1000 400" stroke="#4f77c9" stroke-width="3.4" marker-end="url(#arrow-blue)"/>
<path class="route" d="M1000 520 L1000 585" stroke="#3c987e" stroke-width="3.4" marker-end="url(#arrow-green)"/>
<path class="route" d="M1000 710 L1000 775" stroke="#d28a28" stroke-width="3.4" marker-end="url(#arrow-amber)"/>
<path class="route" d="M910 900 L910.0 934.0 Q910 950 894.0 950.0 L566.0 950.0 Q550 950 550.0 966.0 L550 1000" stroke="#8a65d8" stroke-width="3.4" marker-end="url(#arrow-purple)"/>
<path class="route" d="M1090 900 L1090.0 934.0 Q1090 950 1106.0 950.0 L1434.0 950.0 Q1450 950 1450.0 966.0 L1450 1000" stroke="#2f9f93" stroke-width="3.4" marker-end="url(#arrow-teal)"/>
<path class="route" d="M550 1135 L550.0 1286.0 Q550 1302 566.0 1302.0 L820 1302" stroke="#8a65d8" stroke-width="3.4" marker-end="url(#arrow-purple)"/>
<path class="route" d="M1450 1135 L1450.0 1286.0 Q1450 1302 1434.0 1302.0 L1180 1302" stroke="#2f9f93" stroke-width="3.4" marker-end="url(#arrow-teal)"/>
<g><rect x="1009.6" y="535" width="130.8" height="28" rx="9" fill="#fff" stroke="#d5e2f1"/><text class="route-label" x="1075" y="555" text-anchor="middle" fill="#3c987e">find affected</text></g>
<g><rect x="632" y="912" width="96" height="28" rx="9" fill="#fff" stroke="#d5e2f1"/><text class="route-label" x="680" y="932" text-anchor="middle" fill="#8a65d8">bulk</text></g>
<g><rect x="1272" y="912" width="96" height="28" rx="9" fill="#fff" stroke="#d5e2f1"/><text class="route-label" x="1320" y="932" text-anchor="middle" fill="#2f9f93">single</text></g>
<g><path class="route" d="M220 1245 L268 1245" stroke="#4f77c9" stroke-width="3" marker-end="url(#arrow-blue)"/><text class="small" x="282" y="1250">admin request</text><path class="route" d="M220 1273 L268 1273" stroke="#d28a28" stroke-width="3" marker-end="url(#arrow-amber)"/><text class="small" x="282" y="1278">state update</text><path class="route" d="M220 1301 L268 1301" stroke="#8a65d8" stroke-width="3" marker-end="url(#arrow-purple)"/><text class="small" x="282" y="1306">solver path</text><path class="route" d="M220 1329 L268 1329" stroke="#2f9f93" stroke-width="3" marker-end="url(#arrow-teal)"/><text class="small" x="282" y="1334">fallback path</text></g>
<rect class="alt" x="360" y="1430" width="1280" height="56" rx="16"/><text class="footer" x="1000" y="1466" text-anchor="middle">프로세스 계약: closure rescheduling은 먼저 affected appointment를 분리한 뒤, batch로 최적화하거나 single appointment를 빠르게 배치한다.</text>
</svg>
