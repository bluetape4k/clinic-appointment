value">9,875 ns · p95 77,167</text><rect x="365" y="447.0" width="839.4" height="22" rx="6" fill="#ea580c" data-source="candidate.invalidation.latencyNanos.p50"/><text x="1216.4" y="463.0" class="value">87,708 ns · p95 258,792</text><text x="105" y="536.0" class="row-label">cold-start 생성</text><rect x="365" y="499.0" width="338.8" height="22" rx="6" fill="#2563eb" data-source="baseline.cold-start.latencyNanos.p50"/><text x="715.8" y="515.0" class="value">1,541 ns · p95 4,666</text><rect x="365" y="533.0" width="968.0" height="22" rx="6" fill="#ea580c" data-source="candidate.cold-start.latencyNanos.p50"/><text x="1345.0" y="549.0" class="value">247,625 ns · p95 329,834</text><text x="1420" y="620" class="axis-title" text-anchor="end">latency · lower is better</text>
