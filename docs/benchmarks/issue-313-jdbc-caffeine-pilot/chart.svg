p50"/><text x="1245.9" y="917.0" class="value">7,416 bytes</text><text x="105" y="963.0" class="row-label">cold-start 생성</text><rect x="365" y="932.0" width="626.3" height="20" rx="6" fill="#2563eb" data-source="baseline.cold-start.allocationBytes.p50"/><text x="1003.3" y="947.0" class="value">616 bytes</text><rect x="365" y="962.0" width="989.7" height="20" rx="6" fill="#ea580c" data-source="candidate.cold-start.allocationBytes.p50"/><text x="1366.7" y="977.0" class="value">25,592 bytes</text><text x="1420" y="1015" class="axis-title" text-anchor="end">allocation · lower is better</text>
<rect x="70" y="1065" width="1460" height="92" rx="18" class="decision"/><text x="105" y="1100" class="decision-title">판정: HOLD</text><text x="280" y="1100" class="decision-text">후보 latency p50이 4/4개 프로필에서 baseline보다 높고, 이 결과는 H2 단일 JVM characterization입니다.</text><text x="105" y="1132" class="decision-text">운영 DB·멀티노드·실제 SLO 증거가 없으므로 production EffectivePolicyCache 교체를 승인하지 않습니다.</text>
