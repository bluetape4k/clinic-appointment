  <text x="70" y="812" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#475569">후보 인덱스 사용 계획: 0/21 · 후보 인덱스 크기: 테이블당 1,073,152 bytes · `Rows Removed by Filter`: 두 상태 모두 16,767</text>
  <text x="70" y="838" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#64748b">단일 로컬 Docker 실행의 반복 표본이며 운영 p95·처리량을 의미하지 않는다.</text>
