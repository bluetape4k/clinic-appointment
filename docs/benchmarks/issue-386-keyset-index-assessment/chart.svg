<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Issue #386 keyset 복합 인덱스 평가</title>
  <desc id="desc">세 PostgreSQL scheduling 테이블의 현재 primary-key index와 후보 clinic_id, id 복합 인덱스의 읽기 p95 및 쓰기 p95 비교</desc>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="58" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Issue #386 keyset 복합 인덱스 평가</text>
  <text x="70" y="92" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#475569">PostgreSQL 18.6 · 16 clinic × 2,000행 · warm-up 2회 후 7회 읽기 / 5회 쓰기 p95</text>

  <rect x="1010" y="50" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="1038" y="65" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#334155">현재 primary-key index</text>
  <rect x="1220" y="50" width="18" height="18" rx="3" fill="#f97316"/>
  <text x="1248" y="65" font-family="goorm Sans, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#334155">후보 (clinic_id, id)</text>

