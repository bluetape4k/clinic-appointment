<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-label="Issue #34 환자 예약 취소 latency">
  <title>Issue #34 환자 예약 취소 latency</title>
  <desc>postgres:18-alpine · 100건 · warm-up 30초 · 측정 300초 · seed 34. benchmark 근거이며 배포 SLO가 아니다. p95/p99/lock-wait p95는 ms 단위이며 낮을수록 좋다.</desc>
  <style>
