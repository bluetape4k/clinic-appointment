    .verdict { font: 700 21px "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", "Noto Sans KR", "Arial Unicode MS", sans-serif; }
    .grid { stroke: #40506a; stroke-width: 1; stroke-dasharray: 6 8; }
