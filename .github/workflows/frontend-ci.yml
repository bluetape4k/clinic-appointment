name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/appointment-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/appointment-frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Angular Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/appointment-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: frontend/appointment-frontend/package-lock.json

      - name: Pin frontend toolchain
        run: |
          npm install --global npm@11.12.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production
