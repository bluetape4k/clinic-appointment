spring:
    application:
        name: appointment-api
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:h2:mem:appointment;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
    flyway:
        enabled: false
        locations: classpath:db/migration/{vendor}
    data:
        redis:
            url: redis://localhost:6379

# reminder recovery의 tick 주기와 leader lease는 서로 다른 경계입니다.
bluetape4k:
    leader:
        scheduling:
            enabled: true
            policies:
                - selector: "notificationReminderSchedulingRunner#poll"
                  name: "appointment-reminder-recovery"
                  wait-time: 0s
                  lease-time: 60s
                  min-lease-time: 5s
                  bean: "lettuceLeaderElectionFactory"
                  auto-extend: false
                  stream-bounded: false
                  failure-mode: SKIP

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info,profileReevaluation
    endpoint:
        profileReevaluation:
            # HTTP 권한은 SecurityConfig의 EndpointRequest matcher가 ADMIN으로 제한합니다.
            access: unrestricted

scheduling:
    appointment:
        idempotency:
            ttl: 24h
    security:
        jwt:
            enabled: true
            secret: ${SCHEDULING_JWT_SECRET:}
            issuer: ${SCHEDULING_JWT_ISSUER:appointment-auth-service}
            audience: ${SCHEDULING_JWT_AUDIENCE:appointment-api}
            allowed-clock-skew: ${SCHEDULING_JWT_ALLOWED_CLOCK_SKEW:30s}
    policy:
        # 공개 순서는 shadow compile -> effective read -> admin write -> preview -> activation이다.
        # 기본값은 모두 false이며 후행 flag만 단독으로 켜면 시작 시 configuration validation이 실패한다.
        shadow-compile-enabled: false
        effective-read-enabled: false
        admin-write-enabled: false
        preview-worker-enabled: false
        scheduled-activation-enabled: false
        preview-page-size: 5000
        preview-sync-row-limit: 10000
        preview-sync-deadline: 2s
        preview-job-deadline: 5m
        # caller가 scan 범위를 임의로 확장하지 못하도록 서버가 고정하는 미래 영향 범위다.
        preview-horizon: 30d
        # HTTP Retry-After와 process-local polling limiter가 공유하는 최소 조회 간격이다.
        preview-poll-interval: 1s
        # 한 병원 scope가 보유할 수 있는 PENDING/RUNNING preview 상한이다.
        preview-queue-capacity: 100
        preview-tenant-concurrency: 2
        max-preview-jobs-per-tick: 10
        max-activation-claims-per-tick: 25
        worker-poll-interval: 1s
        worker-lease: 30s
        worker-shutdown-grace: 10s
        activation-lateness-warning: 60s
        activation-missed-after: 5m
        activation-max-attempts: 5
        activation-initial-backoff: 5s
        activation-max-backoff: 2m
        activation-jitter: 0.20
        # idempotency-hash-secret은 기본값을 두지 않는다. 설정된 환경에서만 policy write/worker bean이 생성된다.

appointment:
    waitlist:
        delivery:
            # New vacancy dispatch is opt-in. Recovery jobs remain active while this is false.
            enabled: false
            clinic-allowlist: []
            batch-size: 25
            job-lease: 30s
            max-attempts: 5
            poll-interval: 1s
            retention-interval: 1h
            retention-batch-size: 100
    profile-reevaluation:
        # 병원 허용 목록이 비어 있으면 활성화해도 적용 대상은 없습니다.
        enabled: false
        mutation-mode: DRY_RUN
        clinic-allowlist: []
        held-target: 5m
        proposed-target: 30m
        global-concurrency: 8
        per-clinic-concurrency: 2
        page-size: 50
        max-appointments-per-tick: 100
        poll-interval: 1s
        lease-duration: 30s
        lease-renew-interval: 10s
        retry-max-attempts: 5
        retry-max-elapsed-time: 15m
        retry-initial-backoff: 2s
        retry-max-backoff: 1m
        retry-jitter: 0.20
        auto-redrive-max: 2
        auto-redrive-cooldown: 30m
        assessment:
            # enabled=true일 때 HTTPS URL과 고정 host allowlist를 모두 설정해야 합니다.
            allowed-hosts: []
            connect-timeout: 2s
            read-timeout: 3s
            max-response-bytes: 65536
            max-concurrency: 8
    plan-foundation:
        catalog-sync-enabled: false
        plan-read-enabled: false
        purchase-consumer-mode: OFF
        consumer-max-attempts: 5
        consumer-initial-backoff: 5s
        consumer-max-backoff: 5m
        consumer-jitter: 0.20
        event-replay-window: 15m
